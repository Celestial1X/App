<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ระบบออกใบวางบิล / ใบเสร็จ - B&M VISA CENTER</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@600;700&family=IBM+Plex+Sans+Thai:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ab7a2e;--pink-dark:#86601f;--pink-light:#f4ead2;
  --purple:#1c2b3a;--purple-light:#eef0ea;
  --gray-50:#f6f7f4;--gray-100:#eef0ea;--gray-200:#d8dcd1;
  --gray-300:#c2c8ba;--gray-400:#9aa398;--gray-500:#6b7568;
  --gray-600:#4d564a;--gray-700:#3e4a42;--gray-800:#1c2621;
  --green:#3f6e52;--red:#a23b2e;
}
body{font-family:'IBM Plex Sans Thai','Sarabun',sans-serif;background:var(--gray-100);color:var(--gray-800);min-height:100vh}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:340px 1fr;min-height:calc(100vh - 44px);gap:0}

/* ===== LEFT PANEL (FORM) ===== */
.form-panel{
  background:white;border-right:1px solid var(--gray-200);
  padding:20px;overflow-y:auto;max-height:100vh;
  position:sticky;top:0;
}
.form-panel h2{font-size:15px;font-weight:700;color:var(--gray-800);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--pink-light)}
.form-panel h2::before{content:'';display:block;width:4px;height:16px;background:var(--pink);border-radius:2px}

.form-section{margin-bottom:16px}
.form-section h3{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;
  letter-spacing:0.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-100)}
.form-row{margin-bottom:8px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:3px}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:7px 9px;border:1.5px solid var(--gray-200);border-radius:7px;
  font-family:'Sarabun',sans-serif;font-size:13px;color:var(--gray-800);background:white;outline:none;
  transition:border-color 0.15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,72,153,0.08)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* doc type toggle */
.doc-type-row{display:flex;gap:6px;margin-bottom:14px}
.doc-type-btn{
  flex:1;padding:8px 4px;border-radius:8px;border:2px solid var(--gray-200);
  font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  background:white;color:var(--gray-500);transition:all 0.15s;text-align:center}
.doc-type-btn.active-invoice{border-color:var(--pink);background:var(--pink-light);color:var(--pink-dark)}
.doc-type-btn.active-receipt{border-color:var(--purple);background:var(--purple-light);color:var(--purple)}

/* service rows */
.service-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.service-row{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:8px;position:relative}
.service-row .grid-3i{display:grid;grid-template-columns:1fr 64px 64px 24px;gap:6px;align-items:center}
.service-row input{padding:5px 7px;font-size:12px}
.service-row .sub-names{margin-top:6px}
.service-row .sub-names textarea{font-size:12px;rows:2;padding:5px 7px;min-height:50px}
.btn-remove{background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;border-radius:4px;transition:color 0.1s}
.btn-remove:hover{color:var(--red)}
.btn-add-row{width:100%;padding:7px;border:1.5px dashed var(--pink);border-radius:8px;
  background:var(--pink-light);color:var(--pink-dark);font-family:'Sarabun',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-add-row:hover{background:var(--pink);color:white}

/* payment status */
.pay-status-row{display:flex;gap:6px;flex-wrap:wrap}
.pay-opt input{display:none}
.pay-opt label{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:2px solid var(--gray-200);color:var(--gray-500);transition:all 0.15s;user-select:none;display:block}
.pay-opt input[value="unpaid"]:checked+label{background:#fee2e2;border-color:var(--red);color:var(--red)}
.pay-opt input[value="partial"]:checked+label{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.pay-opt input[value="paid"]:checked+label{background:#d1fae5;border-color:var(--green);color:var(--green)}

.btn-print{
  width:100%;padding:11px;background:var(--pink);color:white;border:none;border-radius:9px;
  font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;
  transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-print:hover{background:var(--pink-dark)}
.btn-save{
  width:100%;padding:9px;background:var(--gray-700);color:white;border:none;border-radius:9px;
  font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;
  transition:background 0.15s}
.btn-save:hover{background:var(--gray-800)}

/* ===== RIGHT PANEL (PREVIEW) ===== */
.preview-panel{padding:24px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.preview-panel h2{align-self:flex-start;font-size:13px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.06em}

/* ===== DOCUMENT SHEET ===== */
.doc-sheet{
  width:210mm;background:white;
  box-shadow:0 4px 24px rgba(0,0,0,0.12);
  border-radius:4px;
  font-family:'Sarabun',sans-serif;
  position:relative;overflow:hidden;
}

/* corner accent */
.doc-sheet::before{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;
  background:var(--accent-color,#ab7a2e);
  clip-path:polygon(100% 0,0 0,100% 100%);
  z-index:1;
}
.doc-sheet.type-invoice{--accent-color:#1c2b3a}
.doc-sheet.type-receipt{--accent-color:#ab7a2e}

.corner-num{
  position:absolute;top:8px;right:10px;z-index:2;
  color:white;font-size:14px;font-weight:700;
}

.doc-inner{padding:28px 32px;display:flex;flex-direction:column;min-height:257mm}

/* header */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.doc-brand{display:flex;align-items:flex-start;gap:12px}
.doc-brand-logo{flex-shrink:0;width:56px;height:56px;display:flex;align-items:center;justify-content:center}
.doc-brand-logo img{width:100%;height:100%;object-fit:contain;border-radius:8px}
.logo-upload-area{
  border:2px dashed var(--gray-200);border-radius:8px;padding:10px;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:60px;cursor:pointer;transition:all 0.15s;font-size:12px;color:var(--gray-500);gap:4px;
  background:var(--gray-50);text-align:center}
.logo-upload-area:hover{border-color:var(--pink);background:var(--pink-light)}
.doc-brand-info{font-size:11px;line-height:1.7;color:var(--gray-700)}
.doc-brand-info strong{font-size:12.5px;color:var(--gray-800);display:block;margin-bottom:2px}
.doc-title-block{text-align:right}
.doc-title{font-size:28px;font-weight:700;line-height:1.1}
.doc-title.invoice{color:var(--purple)}
.doc-title.receipt{color:var(--pink)}
.doc-title-sub{font-size:11px;color:var(--gray-500);margin-top:2px;margin-bottom:10px}
.doc-meta{font-size:12px;line-height:1.8}
.doc-meta td:first-child{color:var(--gray-500);padding-right:12px;white-space:nowrap}
.doc-meta td:last-child{font-weight:600;color:var(--gray-800)}

/* divider */
.doc-divider{border:none;border-top:1px solid var(--gray-200);margin:12px 0}

/* client */
.doc-client-label{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:4px}
.doc-client-name{font-size:13px;font-weight:700;color:var(--gray-800)}
.doc-client-info{font-size:11px;color:var(--gray-600);line-height:1.6}

/* table */
.doc-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
.doc-table thead tr{background:var(--gray-800);color:white}
.doc-table thead th{padding:8px 10px;text-align:left;font-weight:600;font-size:11px}
.doc-table thead th:last-child,.doc-table thead th:nth-last-child(2),.doc-table thead th:nth-last-child(3){text-align:right}
.doc-table tbody tr{border-bottom:1px solid var(--gray-100)}
.doc-table tbody tr:nth-child(even){background:var(--gray-50)}
.doc-table tbody td{padding:9px 10px;vertical-align:top;line-height:1.5}
.doc-table tbody td:last-child,.doc-table tbody td:nth-last-child(2),.doc-table tbody td:nth-last-child(3){text-align:right}
.doc-table .sub-detail{font-size:11px;color:var(--gray-500);margin-top:3px;line-height:1.5}

/* totals */
.doc-totals{display:flex;flex-direction:column;align-items:flex-end;margin-bottom:12px}
.doc-total-row{display:flex;gap:32px;font-size:12px;margin-bottom:4px}
.doc-total-row .lbl{color:var(--gray-500);min-width:100px;text-align:right}
.doc-total-row .val{font-weight:600;min-width:110px;text-align:right}
.doc-total-final .lbl{font-weight:700;color:var(--gray-800);font-size:13px}
.doc-total-final .val{font-weight:700;font-size:13px;color:var(--gray-800)}

.doc-baht-text{font-size:11px;color:var(--gray-500);margin-bottom:10px;padding-left:2px}

/* note */
.doc-note-section{margin-top:8px}
.doc-note-label{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:3px}
.doc-note-text{font-size:11px;color:var(--gray-600);line-height:1.6}

/* payment method (receipt only) */
.doc-pay-method{
  border:1px solid var(--gray-200);border-radius:6px;padding:10px 14px;margin:12px 0;
  font-size:11px;color:var(--gray-600);line-height:1.8}
.doc-pay-method .check-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.doc-check{display:flex;align-items:center;gap:5px}
.doc-check-box{width:13px;height:13px;border:1.5px solid var(--gray-400);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:9px}
.doc-check-box.checked{background:var(--gray-800);color:white;border-color:var(--gray-800)}

/* signatures */
.doc-sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.doc-sig{text-align:center}
.doc-sig-line{border-top:1px solid var(--gray-300);padding-top:6px;font-size:11px;color:var(--gray-600)}
.doc-sig-name{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:2px}
.doc-sig-role{font-size:10px;color:var(--gray-400)}
.doc-sig-space{height:48px}

/* status watermark */
.doc-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);
  font-size:72px;font-weight:900;opacity:0.04;pointer-events:none;white-space:nowrap;
  color:var(--gray-800);z-index:0;user-select:none}

/* ===== PRINT ===== */
@media print{
  body{background:white}
  .form-panel{display:none}
  .preview-panel{padding:0;align-items:stretch}
  .preview-panel>h2{display:none}
  .doc-sheet{box-shadow:none;width:100%;border-radius:0}
  #savedSection{display:none!important}
  @page{size:A4;margin:10mm}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .form-panel{max-height:none;position:relative}
  .doc-sheet{width:100%;max-width:210mm}
}
</style>

<div class="app">

<!-- ===== FORM PANEL ===== -->
<div class="form-panel">
  <h2>ตั้งค่าเอกสาร</h2>

  <!-- doc type -->
  <div class="doc-type-row">
    <button class="doc-type-btn active-invoice" id="btnInvoice" onclick="setDocType('invoice')">ใบวางบิล</button>
    <button class="doc-type-btn" id="btnReceipt" onclick="setDocType('receipt')">ใบเสร็จรับเงิน</button>
  </div>

    <!-- company info -->
  <div class="form-section">
    <h3>ข้อมูลบริษัทผู้ออกเอกสาร</h3>
    <div class="form-row">
      <label>โลโก้บริษัท</label>
      <div class="logo-upload-area" id="logoUploadArea" onclick="document.getElementById('logoInput').click()">
        <input type="file" id="logoInput" accept="image/*" style="display:none" onchange="handleLogoUpload(this)" />
        <span id="logoUploadHint">คลิกเพื่ออัปโหลดโลโก้</span>
        <img id="logoPreviewImg" src="" style="display:none;max-width:80px;max-height:80px;border-radius:8px;object-fit:contain" />
        <button type="button" id="logoRemoveBtn" style="display:none;font-size:11px;background:var(--red-light,#fee2e2);color:var(--red);border:none;border-radius:6px;padding:3px 8px;cursor:pointer;margin-top:4px" onclick="event.stopPropagation();removeLogo()">ลบโลโก้</button>
      </div>
    </div>
    <div class="form-row">
      <label>ชื่อบริษัท / ร้าน</label>
      <input id="companyName" type="text" value="" placeholder="ชื่อบริษัท / ร้าน" oninput="render()" />
    </div>
    <div class="form-row">
      <label>ที่อยู่บริษัท</label>
      <textarea id="companyAddr" rows="2" oninput="render()" placeholder="ที่อยู่บริษัท"></textarea>
    </div>
    <div class="grid-2">
      <div class="form-row">
        <label>เลขประจำตัวผู้เสียภาษี (บริษัท)</label>
        <input id="companyTax" type="text" value="" placeholder="เลขประจำตัวผู้เสียภาษี" oninput="render()" />
      </div>
      <div class="form-row">
        <label>เบอร์โทร</label>
        <input id="companyPhone" type="text" value="" placeholder="เช่น 0812345678" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- doc info -->
  <div class="form-section">
    <h3>ข้อมูลเอกสาร</h3>
    <div class="grid-2">
      <div class="form-row">
        <label>เลขที่เอกสาร</label>
        <input id="docNumber" type="text" id="docNumber" type="text" readonly style="background:var(--gray-50);cursor:default" oninput="render()" />
      </div>
      <div class="form-row">
        <label>วันที่</label>
        <input id="docDate" type="date" oninput="render()" />
      </div>
    </div>
    <div class="grid-2">
      <div class="form-row">
        <label>ครบกำหนด / อ้างอิง</label>
        <input id="docRef" type="text" placeholder="วันที่ / เลขอ้างอิง" oninput="render()" />
      </div>
      <div class="form-row">
        <label>ผู้ขาย / ผู้รับ</label>
        <input id="docSeller" type="text" value="" placeholder="ชื่อผู้ขาย / ผู้รับ" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- client -->
  <div class="form-section">
    <h3>ข้อมูลลูกค้า</h3>
    <div class="form-row">
      <label>ชื่อลูกค้า / บริษัท</label>
      <input id="clientName" type="text" placeholder="บริษัท / ชื่อนายจ้าง" oninput="render()" />
    </div>
    <div class="form-row">
      <label>ที่อยู่</label>
      <textarea id="clientAddr" rows="2" placeholder="ที่อยู่ลูกค้า" oninput="render()"></textarea>
    </div>
    <div class="form-row">
      <label>เลขประจำตัวผู้เสียภาษี</label>
      <input id="clientTax" type="text" placeholder="เลขประจำตัวผู้เสียภาษี" oninput="render()" />
    </div>
  </div>

  <!-- services -->
  <div class="form-section">
    <h3>รายการบริการ</h3>
    <div class="service-list" id="serviceList"></div>
    <button class="btn-add-row" onclick="addRow()">+ เพิ่มรายการ</button>
  </div>

  <!-- note -->
  <div class="form-section">
    <h3>หมายเหตุ</h3>
    <div class="form-row">

  <!-- payment (receipt only) -->

      <label>วิธีชำระ</label>
      <select id="payMethod" onchange="render()">

    <div class="grid-2">

  <!-- signatures -->
  <div class="form-section">
    <h3>ลายเซ็น / ผู้ออกเอกสาร</h3>
    <div class="grid-2">
      <div class="form-row">
        <label>ชื่อผู้ออกเอกสาร (ฝั่งขวา)</label>

    <!-- status -->

      <div class="pay-opt"><input type="radio" name="ps" id="ps2" value="partial" onchange="render()" /><label for="ps2">บางส่วน</label></div>
      <div class="pay-opt"><input type="radio" name="ps" id="ps3" value="paid" onchange="render()" /><label for="ps3">จ่ายแล้ว</label></div>
    </div>
  </div>

  <button class="btn-print" onclick="window.print()">พิมพ์ / บันทึก PDF</button>
  <button class="btn-save" onclick="saveToList()">บันทึกลงระบบ</button>
  <div id="saveMsg" style="font-size:12px;color:var(--green);margin-top:6px;text-align:center"></div>

  <!-- saved list in sidebar -->
  <div id="savedSection" style="display:none;margin-top:16px">
    <div style="display:flex;align-items:center;justify-content:space-between;margin-bottom:4px">
      <span style="font-size:12px;font-weight:700;color:var(--gray-700)">เอกสารที่บันทึกไว้</span>
      <div style="display:flex;gap:4px;align-items:center">
        <span id="savedCount" style="font-size:11px;color:var(--gray-400)"></span>
        <button onclick="clearAllDocs()" style="font-size:10px;padding:2px 6px;border-radius:4px;border:1px solid #fca5a5;background:#fee2e2;color:#ef4444;cursor:pointer;font-family:inherit">ล้างทั้งหมด</button>
      </div>
    </div>
    <div id="syncStatus" style="font-size:10.5px;color:var(--gray-400);margin-bottom:8px"></div>
    <div id="savedList" style="display:flex;flex-direction:column;gap:6px;max-height:320px;overflow-y:auto"></div>

<!-- ===== PREVIEW PANEL ===== -->
<div class="preview-panel">
  <h2>ตัวอย่างเอกสาร</h2>
  <div class="doc-sheet type-invoice" id="docSheet">
    <div class="corner-num">1</div>
    <div class="doc-watermark" id="docWatermark"></div>
    <div class="doc-inner" id="docInner"></div>
  </div>

</div>

</div>

<script>
let docType = 'invoice';
let logoDataUrl = null;
let rows = [];
let savedDocs = JSON.parse(localStorage.getItem('bmvisa_bills') || '[]');
let _initDone = false;

// ── Server sync (falls back to localStorage-only if offline/unreachable) ──
const normalizeApiBaseUrl = (value) => String(value || '').trim().replace(/\/+$/, '');
const resolveApiBaseUrl = () => {
  const params = new URLSearchParams(window.location.search || '');
  const queryBase = normalizeApiBaseUrl(params.get('apiBase'));
  if (queryBase) { localStorage.setItem('recordsApiBaseUrl', queryBase); return queryBase; }
  const storedBase = normalizeApiBaseUrl(localStorage.getItem('recordsApiBaseUrl'));
  if (storedBase) return storedBase;
  return normalizeApiBaseUrl(window.RECORDS_API_BASE_URL);
};
const API_BASE_URL = resolveApiBaseUrl();
const BILLING_API_URL = API_BASE_URL ? `${API_BASE_URL}/api/billing` : '/api/billing';
const canUseServerSync = () => Boolean(API_BASE_URL) || window.location.protocol.startsWith('http');

async function fetchSavedDocsFromServer() {
  const statusEl = document.getElementById('syncStatus');
  if (!canUseServerSync()) {
    if (statusEl) statusEl.textContent = 'โหมดออฟไลน์: เก็บในเครื่องนี้เท่านั้น';
    return null;
  }
  try {
    const res = await fetch(BILLING_API_URL, { method: 'GET' });
    if (!res.ok) throw new Error('bad status ' + res.status);
    const docs = await res.json();
    if (!Array.isArray(docs)) throw new Error('unexpected response');
    savedDocs = docs;
    localStorage.setItem('bmvisa_bills', JSON.stringify(savedDocs));
    if (statusEl) statusEl.textContent = 'เชื่อมต่อเซิร์ฟเวอร์แล้ว · ข้อมูลนี้เห็นตรงกันทุกเครื่อง';
    return docs;
  } catch (e) {
    console.warn('billing: server fetch failed, using local cache', e);
    if (statusEl) statusEl.textContent = 'เชื่อมต่อเซิร์ฟเวอร์ไม่ได้ · แสดงเฉพาะข้อมูลในเครื่องนี้';
    return null;
  }
}

async function pushDocToServer(doc) {
  if (!canUseServerSync()) return false;
  try {
    const res = await fetch(BILLING_API_URL, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(doc),
    });
    return res.ok;
  } catch (e) {
    console.warn('billing: server save failed, kept locally only', e);
    return false;
  }
}

async function deleteDocOnServer(docNumber) {
  if (!canUseServerSync() || !docNumber) return false;
  try {
    const res = await fetch(`${BILLING_API_URL}/${encodeURIComponent(docNumber)}`, { method: 'DELETE' });
    return res.ok;
  } catch (e) {
    console.warn('billing: server delete failed', e);
    return false;
  }
}

async function clearDocsOnServer() {
  if (!canUseServerSync()) return false;
  try {
    const res = await fetch(BILLING_API_URL, { method: 'DELETE' });
    return res.ok;
  } catch (e) {
    console.warn('billing: server clear failed', e);
    return false;
  }
}

const startBillingRealtimeSync = () => {
  if (!canUseServerSync() || typeof window.EventSource === 'undefined') return;
  const streamUrl = API_BASE_URL ? `${API_BASE_URL}/api/stream` : '/api/stream';
  try {
    const source = new EventSource(streamUrl);
    source.addEventListener('billing-change', () => {
      fetchSavedDocsFromServer().then((docs) => { if (docs) renderSaved(); });
    });
    source.onerror = () => { /* EventSource auto-reconnects */ };
  } catch (_e) { /* fallback: manual refresh only */ }
};

// generate doc number: BL/INV + YYYYMMDD + seq
function genDocNumber(type) {
  const d = new Date();
  const yy = d.getFullYear();
  const mm = String(d.getMonth()+1).padStart(2,'0');
  const dd = String(d.getDate()).padStart(2,'0');
  const prefix = type === 'invoice' ? 'INV' : 'BL';
  const storageKey = 'bmvisa_seq_' + prefix + yy + mm + dd;
  let seq = parseInt(localStorage.getItem(storageKey) || '0') + 1;
  localStorage.setItem(storageKey, seq);
  return prefix + yy + mm + dd + String(seq).padStart(4,'0');
}

// init
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('docDate').value = today;
  document.getElementById('payDate').value = today;
  document.getElementById('docRef').value = today;

  // restore saved logo
  const savedLogo = localStorage.getItem('bmvisa_logo');
  if (savedLogo) {
    logoDataUrl = savedLogo;
    document.getElementById('logoPreviewImg').src = savedLogo;
    document.getElementById('logoPreviewImg').style.display = 'block';
    document.getElementById('logoUploadHint').style.display = 'none';
    document.getElementById('logoRemoveBtn').style.display = 'inline-block';
  }

  // auto-generate doc number
  document.getElementById('docNumber').value = genDocNumber(docType);

  // start with one empty row
  rows.push({id:1, name:'', qty:'', price:'', sub:''});
  rebuildServiceList();

  _initDone = true;
  render();
  renderSaved();
  fetchSavedDocsFromServer().then((docs) => { if (docs) renderSaved(); });
  startBillingRealtimeSync();
});

function setDocType(type) {
  docType = type;
  document.getElementById('btnInvoice').className = 'doc-type-btn' + (type==='invoice'?' active-invoice':'');
  document.getElementById('btnReceipt').className = 'doc-type-btn' + (type==='receipt'?' active-receipt':'');
  document.getElementById('paySection').style.display = type==='receipt'?'block':'none';

  // regenerate doc number for new type
  document.getElementById('docNumber').value = genDocNumber(type);
  render();
}

function addRow(name='',qty='',price='',sub='') {
  const id = Date.now() + Math.random();
  rows.push({id,name,qty,price,sub});
  rebuildServiceList();
  if (_initDone) render();
}

function rebuildServiceList() {
  const list = document.getElementById('serviceList');
  list.innerHTML = '';
  rows.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'service-row';
    div.dataset.idx = i;

    // name input
    const nameEl = document.createElement('input');
    nameEl.type = 'text';
    nameEl.placeholder = 'รายการบริการ';
    nameEl.value = r.name || '';
    nameEl.addEventListener('input', e => { rows[i].name = e.target.value; render(); });

    // qty input
    const qtyEl = document.createElement('input');
    qtyEl.type = 'number';
    qtyEl.placeholder = 'จำนวน';
    qtyEl.value = r.qty || '';
    qtyEl.min = '0';
    qtyEl.addEventListener('input', e => { rows[i].qty = e.target.value; render(); });

    // price input
    const priceEl = document.createElement('input');
    priceEl.type = 'number';
    priceEl.placeholder = 'ราคา/หน่วย';
    priceEl.value = r.price || '';
    priceEl.min = '0';
    priceEl.addEventListener('input', e => { rows[i].price = e.target.value; render(); });

    // remove button
    const removeBtn = document.createElement('button');
    removeBtn.className = 'btn-remove';
    removeBtn.title = 'ลบ';
    removeBtn.textContent = '×';
    removeBtn.addEventListener('click', () => removeRow(i));

    // grid row
    const grid = document.createElement('div');
    grid.className = 'grid-3i';
    grid.append(nameEl, qtyEl, priceEl, removeBtn);

    // sub textarea — NOT triggering rebuildServiceList on input
    const subEl = document.createElement('textarea');
    subEl.placeholder = 'รายชื่อ / รายละเอียดเพิ่มเติม (ถ้ามี)';
    subEl.textContent = r.sub || '';
    subEl.addEventListener('input', e => { rows[i].sub = e.target.value; render(); });

    const subWrap = document.createElement('div');
    subWrap.className = 'sub-names';
    subWrap.appendChild(subEl);

    div.append(grid, subWrap);
    list.appendChild(div);
  });
}

function removeRow(i) {
  rows.splice(i,1);
  rebuildServiceList();
  render();
}

function bahtText(n) {
  if (!n) return 'ศูนย์บาทถ้วน';
  const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
  const places = ['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  const digits = String(Math.round(n)).split('').reverse();
  let result = '';
  digits.forEach((d,i) => {
    const di = parseInt(d);
    if (!di) return;
    if (i===1 && di===1) result = 'สิบ' + result;
    else if (i===1 && di===2) result = 'ยี่สิบ' + result;
    else result = ones[di] + places[i] + result;
  });
  return result + 'บาทถ้วน';
}

function handleLogoUpload(input) {
  const file = input.files[0];
  if (!file) return;
  const reader = new FileReader();
  reader.onload = e => {
    logoDataUrl = e.target.result;
    document.getElementById('logoPreviewImg').src = logoDataUrl;
    document.getElementById('logoPreviewImg').style.display = 'block';
    document.getElementById('logoUploadHint').style.display = 'none';
    document.getElementById('logoRemoveBtn').style.display = 'inline-block';
    localStorage.setItem('bmvisa_logo', logoDataUrl);
    render();
  };
  reader.readAsDataURL(file);
}

function removeLogo() {
  logoDataUrl = null;
  document.getElementById('logoPreviewImg').src = '';
  document.getElementById('logoPreviewImg').style.display = 'none';
  document.getElementById('logoUploadHint').style.display = 'block';
  document.getElementById('logoRemoveBtn').style.display = 'none';
  document.getElementById('logoInput').value = '';
  localStorage.removeItem('bmvisa_logo');
  render();
}

function fmt(n) { return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function render() {
  const type = docType;
  const sheet = document.getElementById('docSheet');
  sheet.className = 'doc-sheet type-' + (type==='invoice'?'invoice':'receipt');

  const watermark = document.getElementById('docWatermark');
  const ps = document.querySelector('input[name="ps"]:checked')?.value || 'unpaid';
  watermark.textContent = ps==='paid'?'ชำระแล้ว':ps==='partial'?'ชำระบางส่วน':'';

  const docNumber = document.getElementById('docNumber').value;
  const docDate = document.getElementById('docDate').value;
  const docRef = document.getElementById('docRef').value;
  const docSeller = document.getElementById('docSeller').value;
  const clientName = document.getElementById('clientName').value || '—';
  const clientAddr = document.getElementById('clientAddr').value;
  const clientTax = document.getElementById('clientTax').value;
  const docNote = document.getElementById('docNote').value;
  const companyName = document.getElementById('companyName').value || '';
  const companyAddr = document.getElementById('companyAddr').value;
  const companyTax = document.getElementById('companyTax').value;
  const companyPhone = document.getElementById('companyPhone').value;
  const signerName = document.getElementById('signerName').value || '';
  const signerClientLabel = document.getElementById('signerClientLabel').value || '';

  // totals
  let subtotal = 0;
  rows.forEach(r => { subtotal += (parseFloat(r.qty)||0)*(parseFloat(r.price)||0); });
  const total = subtotal;

  // payment method (receipt)
  const payMethod = document.getElementById('payMethod').value;
  const payBank = document.getElementById('payBank').value;
  const payDate = document.getElementById('payDate').value;
  const methodLabels = {cash:'เงินสด',check:'เช็ค',online:'โอนเงิน',card:'บัตรเครดิต'};

  const isBill = type==='invoice';
  const titleTh = isBill ? 'ใบวางบิล' : 'ใบเสร็จรับเงิน';
  const titleClass = isBill ? 'invoice' : 'receipt';
  const refLabel = isBill ? 'ครบกำหนด' : 'อ้างอิง';

  // service rows html
  const rowsHtml = rows.map((r,i) => {
    const lineTotal = (parseFloat(r.qty)||0)*(parseFloat(r.price)||0);
    const subHtml = r.sub ? `<div class="sub-detail">${r.sub.replace(/\n/g,'<br/>')}</div>` : '';
    const unit = r.qty ? `${r.qty} คน` : '';
    return `<tr>
      <td style="color:var(--gray-500)">${i+1}</td>
      <td>${r.name||''}${subHtml}</td>
      <td>${unit}</td>
      <td>${r.price?fmt(r.price):''}</td>
      <td>${lineTotal?fmt(lineTotal):''}</td>
    </tr>`;
  }).join('');

  // payment section (receipt only)
  const payHtml = !isBill ? `
    <div class="doc-pay-method">
      <div class="check-row">
        ${['cash','check','online','card'].map(m=>`
          <div class="doc-check">
            <div class="doc-check-box ${payMethod===m?'checked':''}">${payMethod===m?'&#10003;':''}</div>
            <span>${methodLabels[m]}</span>
          </div>`).join('')}
      </div>
      <div>ธนาคาร <strong>${payBank||'—'}</strong>&nbsp;&nbsp;&nbsp;เลขที่ <span style="min-width:80px;display:inline-block;border-bottom:1px solid var(--gray-300)">&nbsp;</span>&nbsp;&nbsp;&nbsp;วันที่ <strong>${payDate||'—'}</strong>&nbsp;&nbsp;&nbsp;จำนวนเงิน <strong>${fmt(total)} บาท</strong></div>
    </div>` : '';

  const sigLeft = isBill ? 'ผู้รับวางบิล' : 'ผู้จ่ายเงิน';
  const sigRight = isBill ? 'ผู้วางบิล' : 'ผู้รับเงิน';

  document.getElementById('docInner').innerHTML = `
    <div class="doc-header">
      <div class="doc-brand">
        <div class="doc-brand-logo">
          ${logoDataUrl
            ? `<img src="${logoDataUrl}" alt="logo" />`
            : `<svg width="56" height="56" viewBox="0 0 56 56" fill="none" xmlns="http://www.w3.org/2000/svg">
                <circle cx="28" cy="28" r="28" fill="url(#bmgrad)"/>
                <defs><linearGradient id="bmgrad" x1="0" y1="0" x2="56" y2="56" gradientUnits="userSpaceOnUse"><stop stop-color="#38bdf8"/><stop offset="1" stop-color="#0ea5e9"/></linearGradient></defs>
                <text x="28" y="36" text-anchor="middle" font-family="Georgia,serif" font-weight="700" font-size="20" fill="white" letter-spacing="1">BM</text>
              </svg>`
          }
        </div>
        <div class="doc-brand-info">
          <strong>${companyName}</strong><br/>
          ${companyAddr}<br/>
          ${companyTax ? 'เลขประจำตัวผู้เสียภาษี ' + companyTax + '<br/>' : ''}
          ${companyPhone ? 'โทร. ' + companyPhone : ''}
        </div>
      </div>
      <div class="doc-title-block">
        <div class="doc-title ${titleClass}">${titleTh}</div>
        <div class="doc-title-sub">ต้นฉบับ</div>
        <table class="doc-meta">
          <tr><td>เลขที่</td><td>${docNumber||'—'}</td></tr>
          <tr><td>วันที่</td><td>${docDate||'—'}</td></tr>
          <tr><td>${refLabel}</td><td>${docRef||'—'}</td></tr>
          <tr><td>${isBill?'ผู้ขาย':'ผู้รับ'}</td><td>${docSeller||'—'}</td></tr>
        </table>
      </div>
    </div>

    <hr class="doc-divider"/>

    <div class="doc-client-label">ลูกค้า</div>
    <div class="doc-client-name">${clientName}</div>
    ${clientAddr?`<div class="doc-client-info">${clientAddr.replace(/\n/g,'<br/>')}</div>`:''}
    ${clientTax?`<div class="doc-client-info">เลขประจำตัวผู้เสียภาษี ${clientTax}</div>`:''}

    <table class="doc-table">
      <thead>
        <tr>
          <th style="width:28px">#</th>
          <th>รายละเอียด</th>
          <th style="width:72px;text-align:right">จำนวน</th>
          <th style="width:90px;text-align:right">ราคาต่อหน่วย</th>
          <th style="width:90px;text-align:right">ยอดรวม</th>
        </tr>
      </thead>
      <tbody>${rowsHtml}</tbody>
    </table>

    <div class="doc-totals">
      <div class="doc-total-row">
        <span class="lbl">รวมเป็นเงิน</span>
        <span class="val">${fmt(subtotal)} บาท</span>
      </div>
      <div class="doc-total-row doc-total-final">
        <span class="lbl">จำนวนเงินรวมทั้งสิ้น</span>
        <span class="val">${fmt(total)} บาท</span>
      </div>
    </div>

    <div class="doc-baht-text">(${bahtText(total)})</div>

    ${payHtml}

    ${docNote?`<div class="doc-note-section">
      <div class="doc-note-label">หมายเหตุ</div>
      <div class="doc-note-text">${docNote.replace(/\n/g,'<br/>')}</div>
    </div>`:''}

    <div class="doc-sigs" style="margin-top:auto;padding-top:32px">
      <div class="doc-sig">
        <div class="doc-sig-space"></div>
        <div class="doc-sig-line">
          <div class="doc-sig-name">${signerClientLabel || ("ในนาม " + clientName)}</div>
          <div class="doc-sig-role">${sigLeft} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; วันที่ ___________</div>
        </div>
      </div>
      <div class="doc-sig">
        <div class="doc-sig-space" style="display:flex;align-items:flex-end;justify-content:center;padding-bottom:4px">
          <div style="text-align:center">
            <div style="font-size:22px;font-family:cursive;color:var(--gray-600);line-height:1">Bm.</div>
            <div style="font-size:12px;margin-top:2px;color:var(--gray-700)">${signerName} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; ${docDate||''}</div>
          </div>
        </div>
        <div class="doc-sig-line">
          <div class="doc-sig-name">ในนาม ${companyName}</div>
          <div class="doc-sig-role">${sigRight} &nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp;&nbsp; วันที่ ___________</div>
        </div>
      </div>
    </div>
  `;
}

function collectFormData() {
  return {
    docType,
    docNumber: document.getElementById('docNumber').value,
    docDate: document.getElementById('docDate').value,
    docRef: document.getElementById('docRef').value,
    docSeller: document.getElementById('docSeller').value,
    clientName: document.getElementById('clientName').value,
    clientAddr: document.getElementById('clientAddr').value,
    clientTax: document.getElementById('clientTax').value,
    companyName: document.getElementById('companyName').value,
    companyAddr: document.getElementById('companyAddr').value,
    companyTax: document.getElementById('companyTax').value,
    companyPhone: document.getElementById('companyPhone').value,
    docNote: document.getElementById('docNote').value,
    payMethod: document.getElementById('payMethod').value,
    payBank: document.getElementById('payBank').value,
    payDate: document.getElementById('payDate').value,
    payStatus: document.querySelector('input[name="ps"]:checked')?.value || 'unpaid',
    signerName: document.getElementById('signerName').value,
    signerClientLabel: document.getElementById('signerClientLabel').value,
    rows: JSON.parse(JSON.stringify(rows)),
    logoDataUrl: logoDataUrl || null,
  };
}

function setVal(id, val) {
  const el = document.getElementById(id);
  if (el) el.value = val || '';
}

function loadFormData(d) {
  try {
    docType = d.docType || 'invoice';
    document.getElementById('btnInvoice').className = 'doc-type-btn' + (docType==='invoice'?' active-invoice':'');
    document.getElementById('btnReceipt').className = 'doc-type-btn' + (docType==='receipt'?' active-receipt':'');
    document.getElementById('paySection').style.display = docType==='receipt'?'block':'none';

    setVal('docNumber', d.docNumber);
    setVal('docDate', d.docDate);
    setVal('docRef', d.docRef);
    setVal('docSeller', d.docSeller);
    setVal('clientName', d.clientName);
    setVal('clientAddr', d.clientAddr);
    setVal('clientTax', d.clientTax);
    setVal('companyName', d.companyName);
    setVal('companyAddr', d.companyAddr);
    setVal('companyTax', d.companyTax);
    setVal('companyPhone', d.companyPhone);
    setVal('docNote', d.docNote);
    setVal('payMethod', d.payMethod || 'online');
    setVal('payBank', d.payBank);
    setVal('payDate', d.payDate);
    setVal('signerName', d.signerName);
    setVal('signerClientLabel', d.signerClientLabel);

    const ps = d.payStatus || 'unpaid';
    const psEl = document.querySelector('input[name="ps"][value="' + ps + '"]');
    if (psEl) psEl.checked = true;

    rows = Array.isArray(d.rows) ? JSON.parse(JSON.stringify(d.rows)) : [];
    _initDone = true;
    rebuildServiceList();

    if (d.logoDataUrl) {
      logoDataUrl = d.logoDataUrl;
      const img = document.getElementById('logoPreviewImg');
      const hint = document.getElementById('logoUploadHint');
      const rmBtn = document.getElementById('logoRemoveBtn');
      if (img) { img.src = logoDataUrl; img.style.display = 'block'; }
      if (hint) hint.style.display = 'none';
      if (rmBtn) rmBtn.style.display = 'inline-block';
    } else {
      logoDataUrl = null;
      const img = document.getElementById('logoPreviewImg');
      const hint = document.getElementById('logoUploadHint');
      const rmBtn = document.getElementById('logoRemoveBtn');
      if (img) { img.src = ''; img.style.display = 'none'; }
      if (hint) hint.style.display = 'block';
      if (rmBtn) rmBtn.style.display = 'none';
    }

    render();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  } catch(e) {
    alert('เกิดข้อผิดพลาด: ' + e.message);
    console.error(e);
  }
}

function saveToList() {
  const data = collectFormData();
  let total = 0;
  rows.forEach(r => { total += (parseFloat(r.qty)||0)*(parseFloat(r.price)||0); });
  data.total = total;

  const existingIdx = savedDocs.findIndex(d => d.docNumber === data.docNumber);
  if (existingIdx >= 0) {
    savedDocs[existingIdx] = { ...savedDocs[existingIdx], ...data };
  } else {
    data.id = Date.now();
    savedDocs.unshift(data);
  }
  localStorage.setItem('bmvisa_bills', JSON.stringify(savedDocs));

  const msg = document.getElementById('saveMsg');
  pushDocToServer(data).then((synced) => {
    msg.textContent = synced ? 'บันทึกเรียบร้อย (ซิงก์กับเซิร์ฟเวอร์แล้ว)' : 'บันทึกเรียบร้อย (เก็บไว้ในเครื่องนี้เท่านั้น)';
    setTimeout(() => msg.textContent = '', 3200);
  });
  renderSaved();
}

function clearAllDocs() {
  if (!confirm('ล้างเอกสารทั้งหมด?')) return;
  savedDocs = [];
  localStorage.removeItem('bmvisa_bills');
  clearDocsOnServer();
  renderSaved();
}

function renderSaved() {
  const sec = document.getElementById('savedSection');
  const list = document.getElementById('savedList');
  const countEl = document.getElementById('savedCount');
  sec.style.display = 'block';
  if (countEl) countEl.textContent = savedDocs.length + ' รายการ';
  if (!savedDocs.length) {
    list.innerHTML = '<p style="font-size:11px;color:var(--gray-400);padding:8px 0">ยังไม่มีเอกสารที่บันทึกไว้</p>';
    return;
  }
  const statusColor = {paid:'#10b981', unpaid:'#ef4444', partial:'#f59e0b'};
  const statusLabel = {paid:'จ่ายแล้ว', unpaid:'ค้างชำระ', partial:'บางส่วน'};
  list.innerHTML = '';
  savedDocs.forEach((d, idx) => {
    const card = document.createElement('div');
    card.style.cssText = 'background:white;border-radius:8px;padding:10px 12px;box-shadow:0 1px 4px rgba(0,0,0,0.08);font-size:12px;border-left:3px solid ' + (statusColor[d.payStatus]||'#9ca3af');

    const info = document.createElement('div');
    info.style.cssText = 'flex:1;min-width:0';
    info.innerHTML = `
      <div style="font-weight:700;color:var(--gray-800);white-space:nowrap;overflow:hidden;text-overflow:ellipsis">${d.docNumber||'—'}</div>
      <div style="color:var(--gray-500);font-size:11px">${d.docDate||''} · ${d.clientName||'—'}</div>
      <div style="font-weight:700;color:var(--pink-dark);margin-top:2px">฿${Number(d.total||0).toLocaleString()}</div>
      <div style="font-size:10px;color:${statusColor[d.payStatus]||'#9ca3af'}">${statusLabel[d.payStatus]||''}</div>`;

    const openBtn = document.createElement('button');
    openBtn.textContent = 'เปิด';
    openBtn.style.cssText = 'font-size:11px;padding:4px 8px;border-radius:5px;border:1px solid var(--gray-200);background:var(--pink-light);color:var(--pink-dark);cursor:pointer;font-family:inherit;font-weight:600';
    openBtn.addEventListener('click', () => openDoc(idx));

    const delBtn = document.createElement('button');
    delBtn.textContent = 'ลบ';
    delBtn.style.cssText = 'font-size:11px;padding:4px 8px;border-radius:5px;border:1px solid #fca5a5;background:#fee2e2;color:#ef4444;cursor:pointer;font-family:inherit;font-weight:600';
    delBtn.addEventListener('click', () => deleteDoc(idx));

    const btnCol = document.createElement('div');
    btnCol.style.cssText = 'display:flex;flex-direction:column;gap:4px;flex-shrink:0';
    btnCol.append(openBtn, delBtn);

    const row = document.createElement('div');
    row.style.cssText = 'display:flex;justify-content:space-between;align-items:flex-start;gap:6px';
    row.append(info, btnCol);

    card.appendChild(row);
    list.appendChild(card);
  });
}

function openDoc(idx) {
  const d = savedDocs[idx];
  if (!d) { alert('ไม่พบข้อมูล'); return; }
  _initDone = true;
  loadFormData(d);
}

function deleteDoc(idx) {
  const target = savedDocs[idx];
  if (!confirm('ลบเอกสาร ' + (target?.docNumber||'') + ' ?')) return;
  savedDocs.splice(idx, 1);
  localStorage.setItem('bmvisa_bills', JSON.stringify(savedDocs));
  if (target?.docNumber) deleteDocOnServer(target.docNumber);
  renderSaved();
}

// init paySection visibility
document.getElementById('paySection').style.display = 'none';
</script>
</body>
</html>
