<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>ระบบออกใบวางบิล / ใบเสร็จ - B&M VISA CENTER</title>
<link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --pink:#ec4899;--pink-dark:#db2777;--pink-light:#fce7f3;
  --purple:#7c3aed;--purple-light:#ede9fe;
  --gray-50:#f9fafb;--gray-100:#f3f4f6;--gray-200:#e5e7eb;
  --gray-300:#d1d5db;--gray-400:#9ca3af;--gray-500:#6b7280;
  --gray-600:#4b5563;--gray-700:#374151;--gray-800:#1f2937;
  --green:#10b981;--red:#ef4444;
}
body{font-family:'Sarabun',sans-serif;background:#f1f5f9;color:var(--gray-800);min-height:100vh}

/* ===== APP SHELL ===== */
.app{display:grid;grid-template-columns:340px 1fr;min-height:100vh;gap:0}

/* ===== LEFT PANEL (FORM) ===== */
.form-panel{
  background:white;border-right:1px solid var(--gray-200);
  padding:20px;overflow-y:auto;max-height:100vh;
  position:sticky;top:0;
}
.form-panel h2{font-size:15px;font-weight:700;color:var(--gray-800);margin-bottom:16px;
  display:flex;align-items:center;gap:8px;padding-bottom:10px;border-bottom:2px solid var(--pink-light)}
.form-panel h2::before{content:'';display:block;width:4px;height:16px;background:var(--pink);border-radius:2px}

.form-section{margin-bottom:16px}
.form-section h3{font-size:12px;font-weight:700;color:var(--gray-500);text-transform:uppercase;
  letter-spacing:0.05em;margin-bottom:10px;padding-bottom:6px;border-bottom:1px solid var(--gray-100)}
.form-row{margin-bottom:8px}
.form-row label{display:block;font-size:12px;font-weight:600;color:var(--gray-600);margin-bottom:3px}
.form-row input,.form-row select,.form-row textarea{
  width:100%;padding:7px 9px;border:1.5px solid var(--gray-200);border-radius:7px;
  font-family:'Sarabun',sans-serif;font-size:13px;color:var(--gray-800);background:white;outline:none;
  transition:border-color 0.15s}
.form-row input:focus,.form-row select:focus,.form-row textarea:focus{border-color:var(--pink);box-shadow:0 0 0 3px rgba(236,72,153,0.08)}
.grid-2{display:grid;grid-template-columns:1fr 1fr;gap:8px}

/* doc type toggle */
.doc-type-row{display:flex;gap:6px;margin-bottom:14px}
.doc-type-btn{
  flex:1;padding:8px 4px;border-radius:8px;border:2px solid var(--gray-200);
  font-family:'Sarabun',sans-serif;font-size:12px;font-weight:700;cursor:pointer;
  background:white;color:var(--gray-500);transition:all 0.15s;text-align:center}
.doc-type-btn.active-invoice{border-color:var(--pink);background:var(--pink-light);color:var(--pink-dark)}
.doc-type-btn.active-receipt{border-color:var(--purple);background:var(--purple-light);color:var(--purple)}

/* service rows */
.service-list{display:flex;flex-direction:column;gap:6px;margin-bottom:8px}
.service-row{background:var(--gray-50);border:1px solid var(--gray-200);border-radius:8px;padding:8px;position:relative}
.service-row .grid-3i{display:grid;grid-template-columns:1fr 64px 64px 24px;gap:6px;align-items:center}
.service-row input{padding:5px 7px;font-size:12px}
.service-row .sub-names{margin-top:6px}
.service-row .sub-names textarea{font-size:12px;rows:2;padding:5px 7px;min-height:50px}
.btn-remove{background:none;border:none;color:var(--gray-400);cursor:pointer;font-size:14px;
  display:flex;align-items:center;justify-content:center;border-radius:4px;transition:color 0.1s}
.btn-remove:hover{color:var(--red)}
.btn-add-row{width:100%;padding:7px;border:1.5px dashed var(--pink);border-radius:8px;
  background:var(--pink-light);color:var(--pink-dark);font-family:'Sarabun',sans-serif;
  font-size:12px;font-weight:700;cursor:pointer;transition:all 0.15s}
.btn-add-row:hover{background:var(--pink);color:white}

/* payment status */
.pay-status-row{display:flex;gap:6px;flex-wrap:wrap}
.pay-opt input{display:none}
.pay-opt label{
  padding:6px 12px;border-radius:20px;font-size:12px;font-weight:700;cursor:pointer;
  border:2px solid var(--gray-200);color:var(--gray-500);transition:all 0.15s;user-select:none;display:block}
.pay-opt input[value="unpaid"]:checked+label{background:#fee2e2;border-color:var(--red);color:var(--red)}
.pay-opt input[value="partial"]:checked+label{background:#fef3c7;border-color:#f59e0b;color:#92400e}
.pay-opt input[value="paid"]:checked+label{background:#d1fae5;border-color:var(--green);color:var(--green)}

.btn-print{
  width:100%;padding:11px;background:var(--pink);color:white;border:none;border-radius:9px;
  font-family:'Sarabun',sans-serif;font-size:14px;font-weight:700;cursor:pointer;margin-top:12px;
  transition:background 0.15s;display:flex;align-items:center;justify-content:center;gap:6px}
.btn-print:hover{background:var(--pink-dark)}
.btn-save{
  width:100%;padding:9px;background:var(--gray-700);color:white;border:none;border-radius:9px;
  font-family:'Sarabun',sans-serif;font-size:13px;font-weight:700;cursor:pointer;margin-top:6px;
  transition:background 0.15s}
.btn-save:hover{background:var(--gray-800)}

/* ===== RIGHT PANEL (PREVIEW) ===== */
.preview-panel{padding:24px;overflow-y:auto;display:flex;flex-direction:column;align-items:center;gap:16px}
.preview-panel h2{align-self:flex-start;font-size:13px;font-weight:700;color:var(--gray-500);text-transform:uppercase;letter-spacing:0.06em}

/* ===== DOCUMENT SHEET ===== */
.doc-sheet{
  width:210mm;background:white;
  box-shadow:0 4px 24px rgba(0,0,0,0.12);
  border-radius:4px;
  font-family:'Sarabun',sans-serif;
  position:relative;overflow:hidden;
}

/* corner accent */
.doc-sheet::before{
  content:'';position:absolute;top:0;right:0;
  width:60px;height:60px;
  background:var(--accent-color,#ec4899);
  clip-path:polygon(100% 0,0 0,100% 100%);
  z-index:1;
}
.doc-sheet.type-invoice{--accent-color:#7c3aed}
.doc-sheet.type-receipt{--accent-color:#ec4899}

.corner-num{
  position:absolute;top:8px;right:10px;z-index:2;
  color:white;font-size:14px;font-weight:700;
}

.doc-inner{padding:28px 32px}

/* header */
.doc-header{display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:20px}
.doc-brand{display:flex;align-items:flex-start;gap:12px}
.doc-brand img{width:60px;height:60px;object-fit:contain}
.doc-brand-info{font-size:11px;line-height:1.6;color:var(--gray-700)}
.doc-brand-info strong{font-size:12px;color:var(--gray-800)}
.doc-title-block{text-align:right}
.doc-title{font-size:28px;font-weight:700;line-height:1.1}
.doc-title.invoice{color:var(--purple)}
.doc-title.receipt{color:var(--pink)}
.doc-title-sub{font-size:11px;color:var(--gray-500);margin-top:2px;margin-bottom:10px}
.doc-meta{font-size:12px;line-height:1.8}
.doc-meta td:first-child{color:var(--gray-500);padding-right:12px;white-space:nowrap}
.doc-meta td:last-child{font-weight:600;color:var(--gray-800)}

/* divider */
.doc-divider{border:none;border-top:1px solid var(--gray-200);margin:12px 0}

/* client */
.doc-client-label{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:4px}
.doc-client-name{font-size:13px;font-weight:700;color:var(--gray-800)}
.doc-client-info{font-size:11px;color:var(--gray-600);line-height:1.6}

/* table */
.doc-table{width:100%;border-collapse:collapse;margin:16px 0;font-size:12px}
.doc-table thead tr{background:var(--gray-800);color:white}
.doc-table thead th{padding:8px 10px;text-align:left;font-weight:600;font-size:11px}
.doc-table thead th:last-child,.doc-table thead th:nth-last-child(2),.doc-table thead th:nth-last-child(3){text-align:right}
.doc-table tbody tr{border-bottom:1px solid var(--gray-100)}
.doc-table tbody tr:nth-child(even){background:var(--gray-50)}
.doc-table tbody td{padding:9px 10px;vertical-align:top;line-height:1.5}
.doc-table tbody td:last-child,.doc-table tbody td:nth-last-child(2),.doc-table tbody td:nth-last-child(3){text-align:right}
.doc-table .sub-detail{font-size:11px;color:var(--gray-500);margin-top:3px;line-height:1.5}

/* totals */
.doc-totals{display:flex;flex-direction:column;align-items:flex-end;margin-bottom:12px}
.doc-total-row{display:flex;gap:32px;font-size:12px;margin-bottom:4px}
.doc-total-row .lbl{color:var(--gray-500);min-width:100px;text-align:right}
.doc-total-row .val{font-weight:600;min-width:110px;text-align:right}
.doc-total-final .lbl{font-weight:700;color:var(--gray-800);font-size:13px}
.doc-total-final .val{font-weight:700;font-size:13px;color:var(--gray-800)}

.doc-baht-text{font-size:11px;color:var(--gray-500);margin-bottom:10px;padding-left:2px}

/* note */
.doc-note-section{margin-top:8px}
.doc-note-label{font-size:11px;color:var(--pink);font-weight:700;margin-bottom:3px}
.doc-note-text{font-size:11px;color:var(--gray-600);line-height:1.6}

/* payment method (receipt only) */
.doc-pay-method{
  border:1px solid var(--gray-200);border-radius:6px;padding:10px 14px;margin:12px 0;
  font-size:11px;color:var(--gray-600);line-height:1.8}
.doc-pay-method .check-row{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:4px}
.doc-check{display:flex;align-items:center;gap:5px}
.doc-check-box{width:13px;height:13px;border:1.5px solid var(--gray-400);border-radius:2px;
  display:flex;align-items:center;justify-content:center;font-size:9px}
.doc-check-box.checked{background:var(--gray-800);color:white;border-color:var(--gray-800)}

/* signatures */
.doc-sigs{display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:24px}
.doc-sig{text-align:center}
.doc-sig-line{border-top:1px solid var(--gray-300);padding-top:6px;font-size:11px;color:var(--gray-600)}
.doc-sig-name{font-size:12px;font-weight:700;color:var(--gray-800);margin-bottom:2px}
.doc-sig-role{font-size:10px;color:var(--gray-400)}
.doc-sig-space{height:48px}

/* status watermark */
.doc-watermark{
  position:absolute;top:50%;left:50%;transform:translate(-50%,-50%) rotate(-30deg);
  font-size:72px;font-weight:900;opacity:0.04;pointer-events:none;white-space:nowrap;
  color:var(--gray-800);z-index:0;user-select:none}

/* ===== PRINT ===== */
@media print{
  body{background:white}
  .form-panel{display:none}
  .preview-panel{padding:0;align-items:stretch}
  .preview-panel>h2{display:none}
  .doc-sheet{box-shadow:none;width:100%;border-radius:0}
  @page{size:A4;margin:10mm}
}
@media(max-width:900px){
  .app{grid-template-columns:1fr}
  .form-panel{max-height:none;position:relative}
  .doc-sheet{width:100%;max-width:210mm}
}
</style>
</head>
<body>
<div class="app">

<!-- ===== FORM PANEL ===== -->
<div class="form-panel">
  <h2>ตั้งค่าเอกสาร</h2>

  <!-- doc type -->
  <div class="doc-type-row">
    <button class="doc-type-btn active-invoice" id="btnInvoice" onclick="setDocType('invoice')">📋 ใบวางบิล</button>
    <button class="doc-type-btn" id="btnReceipt" onclick="setDocType('receipt')">🧾 ใบเสร็จรับเงิน</button>
  </div>

  <!-- doc info -->
  <div class="form-section">
    <h3>ข้อมูลเอกสาร</h3>
    <div class="grid-2">
      <div class="form-row">
        <label>เลขที่เอกสาร</label>
        <input id="docNumber" type="text" value="BL202604200001" oninput="render()" />
      </div>
      <div class="form-row">
        <label>วันที่</label>
        <input id="docDate" type="date" oninput="render()" />
      </div>
    </div>
    <div class="grid-2">
      <div class="form-row">
        <label>ครบกำหนด / อ้างอิง</label>
        <input id="docRef" type="text" placeholder="วันที่ / เลขอ้างอิง" oninput="render()" />
      </div>
      <div class="form-row">
        <label>ผู้ขาย / ผู้รับ</label>
        <input id="docSeller" type="text" value="Parichad Suso" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- client -->
  <div class="form-section">
    <h3>ข้อมูลลูกค้า</h3>
    <div class="form-row">
      <label>ชื่อลูกค้า / บริษัท</label>
      <input id="clientName" type="text" placeholder="บริษัท / ชื่อนายจ้าง" oninput="render()" />
    </div>
    <div class="form-row">
      <label>ที่อยู่</label>
      <textarea id="clientAddr" rows="2" placeholder="ที่อยู่ลูกค้า" oninput="render()"></textarea>
    </div>
    <div class="form-row">
      <label>เลขประจำตัวผู้เสียภาษี</label>
      <input id="clientTax" type="text" placeholder="เลขประจำตัวผู้เสียภาษี" oninput="render()" />
    </div>
  </div>

  <!-- services -->
  <div class="form-section">
    <h3>รายการบริการ</h3>
    <div class="service-list" id="serviceList"></div>
    <button class="btn-add-row" onclick="addRow()">+ เพิ่มรายการ</button>
  </div>

  <!-- note -->
  <div class="form-section">
    <h3>หมายเหตุ</h3>
    <div class="form-row">
      <textarea id="docNote" rows="2" placeholder="เช่น เลขบัญชีธนาคาร" oninput="render()">เลขบัญชี 800-4-62561-2 ธนาคารกรุงศรี
นางสาวสุจินดา ร่มพฤกษ์</textarea>
    </div>
  </div>

  <!-- payment (receipt only) -->
  <div class="form-section" id="paySection">
    <h3>การชำระเงิน</h3>
    <div class="form-row">
      <label>วิธีชำระ</label>
      <select id="payMethod" onchange="render()">
        <option value="online">โอนเงิน</option>
        <option value="cash">เงินสด</option>
        <option value="check">เช็ค</option>
        <option value="card">บัตรเครดิต</option>
      </select>
    </div>
    <div class="grid-2">
      <div class="form-row">
        <label>ธนาคาร</label>
        <input id="payBank" type="text" value="กรุงไทย" oninput="render()" />
      </div>
      <div class="form-row">
        <label>วันที่ชำระ</label>
        <input id="payDate" type="date" oninput="render()" />
      </div>
    </div>
  </div>

  <!-- status -->
  <div class="form-section">
    <h3>สถานะการชำระ</h3>
    <div class="pay-status-row">
      <div class="pay-opt"><input type="radio" name="ps" id="ps1" value="unpaid" checked onchange="render()" /><label for="ps1">⏳ ยังไม่จ่าย</label></div>
      <div class="pay-opt"><input type="radio" name="ps" id="ps2" value="partial" onchange="render()" /><label for="ps2">💳 บางส่วน</label></div>
      <div class="pay-opt"><input type="radio" name="ps" id="ps3" value="paid" onchange="render()" /><label for="ps3">✅ จ่ายแล้ว</label></div>
    </div>
  </div>

  <button class="btn-print" onclick="window.print()">🖨️ พิมพ์ / บันทึก PDF</button>
  <button class="btn-save" onclick="saveToList()">💾 บันทึกลงระบบ</button>
  <div id="saveMsg" style="font-size:12px;color:var(--green);margin-top:6px;text-align:center"></div>
</div>

<!-- ===== PREVIEW PANEL ===== -->
<div class="preview-panel">
  <h2>ตัวอย่างเอกสาร</h2>
  <div class="doc-sheet type-invoice" id="docSheet">
    <div class="corner-num">1</div>
    <div class="doc-watermark" id="docWatermark"></div>
    <div class="doc-inner" id="docInner"></div>
  </div>

  <!-- saved list -->
  <div id="savedSection" style="width:210mm;display:none">
    <h2 style="margin-bottom:10px">เอกสารที่บันทึกไว้</h2>
    <div id="savedList" style="display:flex;flex-direction:column;gap:8px"></div>
  </div>
</div>

</div>

<script>
let docType = 'invoice';
let rows = [];
let savedDocs = JSON.parse(localStorage.getItem('bmvisa_bills') || '[]');

// init
document.addEventListener('DOMContentLoaded', () => {
  const today = new Date().toISOString().split('T')[0];
  document.getElementById('docDate').value = today;
  document.getElementById('payDate').value = today;
  document.getElementById('docRef').value = today;
  addRow('รายงานตัว 90 วัน', 5, 200);
  addRow('เปลี่ยนนายจ้าง', 3, 1500, 'MR. MYAT MIN SOE\nMR. NAN KO KO NAUNG\nMR. KYAW THET AUNG');
  render();
  renderSaved();
});

function setDocType(type) {
  docType = type;
  document.getElementById('btnInvoice').className = 'doc-type-btn' + (type==='invoice'?' active-invoice':'');
  document.getElementById('btnReceipt').className = 'doc-type-btn' + (type==='receipt'?' active-receipt':'');
  document.getElementById('paySection').style.display = type==='receipt'?'block':'none';

  // update doc number prefix
  const numEl = document.getElementById('docNumber');
  const today = new Date();
  const yy = today.getFullYear();
  const mm = String(today.getMonth()+1).padStart(2,'0');
  const dd = String(today.getDate()).padStart(2,'0');
  const seq = numEl.value.slice(-4) || '0001';
  numEl.value = (type==='invoice'?'INV':'BL') + yy + mm + dd + seq.slice(-4);
  render();
}

function addRow(name='',qty='',price='',sub='') {
  const id = Date.now() + Math.random();
  rows.push({id,name,qty,price,sub});
  rebuildServiceList();
  render();
}

function rebuildServiceList() {
  const list = document.getElementById('serviceList');
  list.innerHTML = '';
  rows.forEach((r,i) => {
    const div = document.createElement('div');
    div.className = 'service-row';
    div.innerHTML = `
      <div class="grid-3i">
        <input type="text" placeholder="รายการบริการ" value="${r.name}" oninput="rows[${i}].name=this.value;render()" />
        <input type="number" placeholder="จำนวน" value="${r.qty}" min="0" oninput="rows[${i}].qty=this.value;render()" />
        <input type="number" placeholder="ราคา/หน่วย" value="${r.price}" min="0" oninput="rows[${i}].price=this.value;render()" />
        <button class="btn-remove" onclick="removeRow(${i})" title="ลบ">✕</button>
      </div>
      <div class="sub-names">
        <textarea placeholder="รายชื่อ / รายละเอียดเพิ่มเติม (ถ้ามี)" oninput="rows[${i}].sub=this.value;render()">${r.sub||''}</textarea>
      </div>`;
    list.appendChild(div);
  });
}

function removeRow(i) {
  rows.splice(i,1);
  rebuildServiceList();
  render();
}

function bahtText(n) {
  if (!n) return 'ศูนย์บาทถ้วน';
  const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
  const places = ['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  const digits = String(Math.round(n)).split('').reverse();
  let result = '';
  digits.forEach((d,i) => {
    const di = parseInt(d);
    if (!di) return;
    if (i===1 && di===1) result = 'สิบ' + result;
    else if (i===1 && di===2) result = 'ยี่สิบ' + result;
    else result = ones[di] + places[i] + result;
  });
  return result + 'บาทถ้วน';
}

function fmt(n) { return Number(n||0).toLocaleString('th-TH',{minimumFractionDigits:2,maximumFractionDigits:2}); }

function render() {
  const type = docType;
  const sheet = document.getElementById('docSheet');
  sheet.className = 'doc-sheet type-' + (type==='invoice'?'invoice':'receipt');

  const watermark = document.getElementById('docWatermark');
  const ps = document.querySelector('input[name="ps"]:checked')?.value || 'unpaid';
  watermark.textContent = ps==='paid'?'ชำระแล้ว':ps==='partial'?'ชำระบางส่วน':'';

  const docNumber = document.getElementById('docNumber').value;
  const docDate = document.getElementById('docDate').value;
  const docRef = document.getElementById('docRef').value;
  const docSeller = document.getElementById('docSeller').value;
  const clientName = document.getElementById('clientName').value || '—';
  const clientAddr = document.getElementById('clientAddr').value;
  const clientTax = document.getElementById('clientTax').value;
  const docNote = document.getElementById('docNote').value;

  // totals
  let subtotal = 0;
  rows.forEach(r => { subtotal += (parseFloat(r.qty)||0)*(parseFloat(r.price)||0); });
  const total = subtotal;

  // payment method (receipt)
  const payMethod = document.getElementById('payMethod').value;
  const payBank = document.getElementById('payBank').value;
  const payDate = document.getElementById('payDate').value;

function bahtText(n) {
  if (!n) return 'ศูนย์บาทถ้วน';
  const ones = ['','หนึ่ง','สอง','สาม','สี่','ห้า','หก','เจ็ด','แปด','เก้า'];
  const tens = ['','สิบ','ยี่สิบ','สามสิบ','สี่สิบ','ห้าสิบ','หกสิบ','เจ็ดสิบ','แปดสิบ','เก้าสิบ'];
  const places = ['','สิบ','ร้อย','พัน','หมื่น','แสน','ล้าน'];
  const digits = String(Math.round(n)).split('').reverse();
  let result = '';
  digits.forEach((d,i) => {
    const di = parseInt(d);
    if (!di) return;
    if (i===1 && di===1) result = 'สิบ' + result;
    else if (i===1 && di===2) result = 'ยี่สิบ' + result;
    else result = ones[di] + places[i] + result;
  });
  return result + 'บาทถ้วน';
}

    .upload-area p { font-size: 13px; color: var(--gray-500); }
    .upload-area strong { color: var(--pink-dark); }
    .preview-grid { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
    .preview-item {
      position: relative;
      width: 72px; height: 72px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid var(--gray-200);
    }
    .preview-item img { width: 100%; height: 100%; object-fit: cover; }
    .preview-item .preview-remove {
      position: absolute;
      top: 2px; right: 2px;
      background: rgba(0,0,0,0.6);
      color: white;
      border: none;
      border-radius: 50%;
      width: 18px; height: 18px;
      font-size: 10px;
      cursor: pointer;
      display: flex; align-items: center; justify-content: center;
    }
    .preview-item.pdf-preview {
      display: flex; align-items: center; justify-content: center;
      background: var(--red-light);
      font-size: 22px;
    }

    /* STATUS BADGE */
    .status-select-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .status-option input { display: none; }
    .status-option label {
      display: flex; align-items: center; gap: 6px;
      padding: 8px 14px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      border: 2px solid var(--gray-200);
      color: var(--gray-500);
      transition: all 0.15s;
      user-select: none;
    }
    .status-option input[value="unpaid"]:checked + label { background: var(--red-light); border-color: var(--red); color: var(--red); }
    .status-option input[value="paid"]:checked + label { background: var(--green-light); border-color: var(--green); color: var(--green); }
    .status-option input[value="partial"]:checked + label { background: var(--yellow-light); border-color: var(--yellow); color: #92400e; }

    /* BUTTONS */
    .form-actions { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .btn-primary {
      background: var(--pink);
      color: white;
      border: none;
      border-radius: 8px;
      padding: 10px 20px;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 700;
      cursor: pointer;
      transition: background 0.15s;
    }
    .btn-primary:hover { background: var(--pink-dark); }
    .btn-secondary {
      background: var(--gray-100);
      color: var(--gray-700);
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      padding: 10px 16px;
      font-family: 'Sarabun', sans-serif;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.15s;
    }
    .btn-secondary:hover { background: var(--gray-200); }
    .save-status { font-size: 13px; color: var(--green); font-weight: 600; }

    /* RECORDS TABLE */
    .records-toolbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }
    .records-toolbar h3 { font-size: 15px; font-weight: 700; color: var(--gray-800); }
    .search-row { display: flex; gap: 8px; flex-wrap: wrap; }
    .search-row input, .search-row select {
      padding: 7px 10px;
      border: 1.5px solid var(--gray-200);
      border-radius: 8px;
      font-family: 'Sarabun', sans-serif;
      font-size: 13px;
      outline: none;
    }
    .search-row input:focus, .search-row select:focus { border-color: var(--pink); }

    .table-wrap { overflow-x: auto; }
    table { width: 100%; border-collapse: collapse; font-size: 13px; }
    thead th {
      background: var(--gray-50);
      padding: 10px 10px;
      text-align: left;
      font-weight: 700;
      color: var(--gray-600);
      border-bottom: 2px solid var(--gray-200);
      white-space: nowrap;
    }
    tbody tr { border-bottom: 1px solid var(--gray-100); transition: background 0.1s; }
    tbody tr:hover { background: var(--pink-soft); }
    tbody td { padding: 10px 10px; vertical-align: middle; }

    .badge {
      display: inline-flex; align-items: center;
      padding: 3px 10px;
      border-radius: 20px;
      font-size: 11px;
      font-weight: 700;
    }
    .badge-paid { background: var(--green-light); color: var(--green); }
    .badge-unpaid { background: var(--red-light); color: var(--red); }
    .badge-partial { background: var(--yellow-light); color: #92400e; }

    .action-btn {
      background: none;
      border: 1.5px solid var(--gray-200);
      border-radius: 6px;
      padding: 4px 8px;
      font-size: 12px;
      cursor: pointer;
      font-family: 'Sarabun', sans-serif;
      transition: all 0.15s;
      color: var(--gray-600);
    }
    .action-btn:hover { background: var(--pink-light); border-color: var(--pink); color: var(--pink-dark); }
    .action-btn.danger:hover { background: var(--red-light); border-color: var(--red); color: var(--red); }

    .thumb-row { display: flex; gap: 4px; flex-wrap: wrap; }
    .thumb {
      width: 32px; height: 32px;
      border-radius: 4px;
      object-fit: cover;
      border: 1px solid var(--gray-200);
      cursor: pointer;
    }
    .thumb-pdf {
      width: 32px; height: 32px;
      border-radius: 4px;
      background: var(--red-light);
      display: flex; align-items: center; justify-content: center;
      font-size: 16px;
      border: 1px solid #fca5a5;
    }

    .empty-state { text-align: center; padding: 32px; color: var(--gray-400); }
    .empty-state .empty-icon { font-size: 36px; margin-bottom: 8px; }

    /* MODAL */
    .modal-overlay {
      display: none;
      position: fixed; inset: 0;
      background: rgba(0,0,0,0.5);
      z-index: 100;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }
    .modal-overlay.is-open { display: flex; }
    .modal-box {
      background: white;
      border-radius: 14px;
      width: 100%; max-width: 500px;
      max-height: 90vh;
      overflow-y: auto;
      box-shadow: var(--shadow-md);
    }
    .modal-header {
      display: flex; justify-content: space-between; align-items: center;
      padding: 16px 20px;
      border-bottom: 1px solid var(--gray-200);
    }
    .modal-header h3 { font-size: 16px; font-weight: 700; }
    .modal-close {
      background: var(--gray-100); border: none; border-radius: 50%;
      width: 30px; height: 30px;
      cursor: pointer; font-size: 14px;
      display: flex; align-items: center; justify-content: center;
    }
    .modal-body { padding: 16px 20px; }
    .modal-body img { max-width: 100%; border-radius: 8px; margin-bottom: 8px; }

    /* LOADER */
    .page-loader {
      position: fixed; inset: 0;
      background: white;
      display: flex; align-items: center; justify-content: center;
      z-index: 999;
      transition: opacity 0.3s;
    }
    .page-loader.hidden { opacity: 0; pointer-events: none; }
    .loader-dots { display: flex; gap: 6px; }
    .loader-dots span {
      width: 10px; height: 10px;
      background: var(--pink);
      border-radius: 50%;
      animation: bounce 0.8s infinite alternate;
    }
    .loader-dots span:nth-child(2) { animation-delay: 0.2s; }
    .loader-dots span:nth-child(3) { animation-delay: 0.4s; }
    @keyframes bounce { to { transform: translateY(-8px); opacity: 0.6; } }

    @media (max-width: 600px) {
      .grid-2, .grid-3 { grid-template-columns: 1fr; }
      .summary-row { grid-template-columns: 1fr 1fr 1fr; }
      .service-item { grid-template-columns: 1fr auto auto; }
      .service-item input.price-input { width: 80px; }
    }
  </style>
</head>

</div>

<main class="container">

  <!-- SUMMARY -->
  <div class="summary-row" id="summaryRow">
    <div class="summary-card total">
      <div class="summary-card__num" id="sumTotal">0</div>
      <div class="summary-card__label">บิลทั้งหมด</div>
    </div>
    <div class="summary-card paid">
      <div class="summary-card__num" id="sumPaid">0</div>
      <div class="summary-card__label">จ่ายแล้ว</div>
    </div>
    <div class="summary-card unpaid">
      <div class="summary-card__num" id="sumUnpaid">0</div>
      <div class="summary-card__label">ยังไม่จ่าย</div>
    </div>
  </div>

  <!-- FORM PANEL -->
  <div class="panel">
    <h2 id="formTitle">สร้างบิลใหม่</h2>

    <div class="form-grid">
      <div class="grid-2">
        <div class="form-row">
          <label for="clientName">ชื่อลูกค้า / นายจ้าง <span style="color:var(--red)">*</span></label>
          <input id="clientName" type="text" placeholder="กรอกชื่อลูกค้า" list="clientSuggestions" />
          <datalist id="clientSuggestions"></datalist>
        </div>
        <div class="form-row">
          <label for="billDate">วันที่วางบิล</label>
          <input id="billDate" type="date" />
        </div>
      </div>

      <div class="form-row">
        <label for="billNote">หมายเหตุ / รายละเอียดเพิ่มเติม</label>
        <input id="billNote" type="text" placeholder="เช่น ต่อวีซ่า, เปลี่ยนนายจ้าง" />
      </div>

      <!-- SERVICE ITEMS -->
      <div class="form-row">
        <label>รายการบริการ</label>
        <div class="service-list" id="serviceList"></div>
        <button type="button" class="btn-add-service" id="addServiceBtn">+ เพิ่มรายการบริการ</button>
      </div>

      <div class="total-box">
        <span class="total-box__label">ยอดรวมทั้งหมด</span>
        <span class="total-box__amount" id="grandTotal">฿0</span>

      <!-- PAYMENT STATUS -->
      <div class="form-row">
        <label>สถานะการชำระ</label>
        <div class="status-select-row">
          <div class="status-option">
            <input type="radio" name="payStatus" id="statusUnpaid" value="unpaid" checked />
            <label for="statusUnpaid">⏳ ยังไม่จ่าย</label>
          </div>
          <div class="status-option">
            <input type="radio" name="payStatus" id="statusPartial" value="partial" />
            <label for="statusPartial">💳 จ่ายบางส่วน</label>
          </div>
          <div class="status-option">
            <input type="radio" name="payStatus" id="statusPaid" value="paid" />
            <label for="statusPaid">✅ จ่ายแล้ว</label>
          </div>
        </div>
      </div>

      <!-- FILE UPLOAD -->
      <div class="form-row">
        <label>แนบรูป / เอกสาร</label>
        <div class="upload-area" id="uploadArea">
          <input type="file" id="fileInput" accept="image/*,.pdf" multiple />
          <div class="upload-icon">📎</div>
          <p><strong>คลิกเพื่อเลือกไฟล์</strong> หรือลากวางที่นี่</p>
          <p>รองรับ JPG, PNG, PDF</p>
        </div>
        <div class="preview-grid" id="previewGrid"></div>
      </div>

      <div class="form-actions">
        <button type="button" class="btn-primary" id="saveBillBtn">💾 บันทึกบิล</button>
        <button type="button" class="btn-secondary" id="clearFormBtn">ล้างฟอร์ม</button>

  <!-- RECORDS PANEL -->
  <div class="panel">

      <h3>รายการบิลทั้งหมด</h3>
      <div class="search-row">
        <input type="search" id="searchInput" placeholder="ค้นหาชื่อลูกค้า..." />
        <select id="filterStatus">
          <option value="">ทุกสถานะ</option>
          <option value="unpaid">ยังไม่จ่าย</option>
          <option value="partial">จ่ายบางส่วน</option>

    <div class="table-wrap">

            <th>วันที่</th>

<!-- IMAGE PREVIEW MODAL -->
<div class="modal-overlay" id="imgModal">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="imgModalTitle">ดูเอกสาร</h3>
      <button class="modal-close" id="imgModalClose">✕</button>
    </div>
    <div class="modal-body" id="imgModalBody"></div>
  </div>
</div>

<script>
const STORAGE_KEY = 'billingRecords';

// ---- STATE ----
let bills = [];
let editId = null;
let attachedFiles = []; // { name, dataUrl, type }

// ---- INIT ----
document.addEventListener('DOMContentLoaded', () => {
  loadBills();
  setTodayDate();
  addServiceRow();
  renderTable();
  renderSummary();
  updateClientSuggestions();
  setTimeout(() => document.getElementById('pageLoader').classList.add('hidden'), 400);
});

function setTodayDate() {
  const d = new Date();
  document.getElementById('billDate').value = d.toISOString().split('T')[0];
}

// ---- STORAGE ----
function loadBills() {
  try { bills = JSON.parse(localStorage.getItem(STORAGE_KEY)) || []; }
  catch { bills = []; }
}
function saveBills() {
  localStorage.setItem(STORAGE_KEY, JSON.stringify(bills));
}

// ---- SERVICE ROWS ----
document.getElementById('addServiceBtn').addEventListener('click', addServiceRow);

function addServiceRow(name = '', price = '') {
  const list = document.getElementById('serviceList');
  const row = document.createElement('div');
  row.className = 'service-item';
  row.innerHTML = `
    <input type="text" placeholder="รายการบริการ เช่น ต่อวีซ่า" class="service-name" value="${name}" />
    <input type="number" placeholder="ราคา" class="price-input service-price" value="${price}" min="0" step="1" />
    <span class="service-total">฿${price ? Number(price).toLocaleString() : '0'}</span>
    <button type="button" class="btn-remove-service" title="ลบ">✕</button>
  `;
  row.querySelector('.service-price').addEventListener('input', updateTotal);
  row.querySelector('.btn-remove-service').addEventListener('click', () => { row.remove(); updateTotal(); });
  list.appendChild(row);
  updateTotal();
}

function updateTotal() {
  let total = 0;
  document.querySelectorAll('.service-item').forEach(row => {
    const price = parseFloat(row.querySelector('.service-price').value) || 0;
    total += price;
    row.querySelector('.service-total').textContent = '฿' + price.toLocaleString();
  });
  document.getElementById('grandTotal').textContent = '฿' + total.toLocaleString();
}

function getServices() {
  return Array.from(document.querySelectorAll('.service-item')).map(row => ({
    name: row.querySelector('.service-name').value.trim(),
    price: parseFloat(row.querySelector('.service-price').value) || 0
  })).filter(s => s.name || s.price);
}

// ---- FILE UPLOAD ----
const uploadArea = document.getElementById('uploadArea');
const fileInput = document.getElementById('fileInput');

uploadArea.addEventListener('click', () => fileInput.click());
fileInput.addEventListener('change', e => handleFiles(e.target.files));

uploadArea.addEventListener('dragover', e => { e.preventDefault(); uploadArea.classList.add('dragover'); });
uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
uploadArea.addEventListener('drop', e => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  handleFiles(e.dataTransfer.files);
});

function handleFiles(files) {
  Array.from(files).forEach(file => {
    const reader = new FileReader();
    reader.onload = e => {
      attachedFiles.push({ name: file.name, dataUrl: e.target.result, type: file.type });
      renderPreview();
    };
    reader.readAsDataURL(file);
  });
}

function renderPreview() {
  const grid = document.getElementById('previewGrid');
  grid.innerHTML = '';
  attachedFiles.forEach((f, i) => {
    const item = document.createElement('div');
    item.className = 'preview-item' + (f.type === 'application/pdf' ? ' pdf-preview' : '');
    if (f.type === 'application/pdf') {
      item.innerHTML = `📄<button class="preview-remove" data-i="${i}">✕</button>`;
    } else {
      item.innerHTML = `<img src="${f.dataUrl}" /><button class="preview-remove" data-i="${i}">✕</button>`;
    }
    item.querySelector('.preview-remove').addEventListener('click', e => {
      e.stopPropagation();
      attachedFiles.splice(Number(e.target.dataset.i), 1);
      renderPreview();
    });
    grid.appendChild(item);
  });
}

// ---- SAVE BILL ----
document.getElementById('saveBillBtn').addEventListener('click', saveBill);

function saveBill() {
  const clientName = document.getElementById('clientName').value.trim();
  if (!clientName) { alert('กรุณากรอกชื่อลูกค้า'); return; }

  const services = getServices();
  const total = services.reduce((s, r) => s + r.price, 0);
  const payStatus = document.querySelector('input[name="payStatus"]:checked').value;
  const billDate = document.getElementById('billDate').value;
  const note = document.getElementById('billNote').value.trim();

  const bill = {
    id: editId || Date.now().toString(),
    clientName,
    services,
    total,
    payStatus,
    billDate,
    note,
    attachments: [...attachedFiles],
    createdAt: editId ? (bills.find(b => b.id === editId)?.createdAt || new Date().toISOString()) : new Date().toISOString()
  };

  if (editId) {
    bills = bills.map(b => b.id === editId ? bill : b);
    editId = null;
    document.getElementById('formTitle').textContent = 'สร้างบิลใหม่';
  } else {
    bills.unshift(bill);
  }

  saveBills();
  clearForm();
  renderTable();
  renderSummary();
  updateClientSuggestions();

  const status = document.getElementById('saveStatus');
  status.textContent = '✅ บันทึกเรียบร้อย';
  setTimeout(() => status.textContent = '', 2500);
}

// ---- CLEAR FORM ----
document.getElementById('clearFormBtn').addEventListener('click', () => { editId = null; clearForm(); document.getElementById('formTitle').textContent = 'สร้างบิลใหม่'; });

function clearForm() {
  document.getElementById('clientName').value = '';
  document.getElementById('billNote').value = '';
  document.getElementById('statusUnpaid').checked = true;
  document.getElementById('serviceList').innerHTML = '';
  attachedFiles = [];
  renderPreview();
  setTodayDate();
  addServiceRow();
  updateTotal();
  fileInput.value = '';
}

// ---- RENDER TABLE ----
function renderTable() {
  const search = document.getElementById('searchInput').value.toLowerCase();
  const filter = document.getElementById('filterStatus').value;
  const filtered = bills.filter(b => {
    const matchSearch = !search || b.clientName.toLowerCase().includes(search) || (b.note || '').toLowerCase().includes(search);
    const matchFilter = !filter || b.payStatus === filter;
    return matchSearch && matchFilter;
  });

  const tbody = document.getElementById('billTableBody');
  const empty = document.getElementById('emptyState');
  tbody.innerHTML = '';

  if (!filtered.length) { empty.style.display = 'block'; return; }
  empty.style.display = 'none';

  filtered.forEach(bill => {
    const statusMap = { paid: ['badge-paid', '✅ จ่ายแล้ว'], unpaid: ['badge-unpaid', '⏳ ยังไม่จ่าย'], partial: ['badge-partial', '💳 บางส่วน'] };
    const [badgeClass, badgeText] = statusMap[bill.payStatus] || ['', '-'];
    const serviceStr = bill.services.map(s => s.name).filter(Boolean).join(', ') || '-';
    const thumbsHtml = (bill.attachments || []).map((f, i) =>
      f.type === 'application/pdf'
        ? `<div class="thumb-pdf" data-id="${bill.id}" data-i="${i}" title="${f.name}" style="cursor:pointer">📄</div>`
        : `<img class="thumb" src="${f.dataUrl}" data-id="${bill.id}" data-i="${i}" title="${f.name}" />`
    ).join('');

    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${bill.billDate || '-'}</td>
      <td><strong>${bill.clientName}</strong>${bill.note ? `<br><span style="font-size:11px;color:var(--gray-400)">${bill.note}</span>` : ''}</td>
      <td style="max-width:160px;font-size:12px">${serviceStr}</td>
      <td style="font-weight:700;color:var(--pink-dark)">฿${bill.total.toLocaleString()}</td>
      <td><span class="badge ${badgeClass}">${badgeText}</span></td>
      <td><div class="thumb-row">${thumbsHtml || '-'}</div></td>
      <td style="white-space:nowrap">
        <button class="action-btn" data-action="edit" data-id="${bill.id}">✏️ แก้ไข</button>
        <button class="action-btn danger" data-action="delete" data-id="${bill.id}">🗑️</button>
      </td>
    `;
    tbody.appendChild(tr);
  });

  // Thumb click → modal
  tbody.querySelectorAll('.thumb, .thumb-pdf').forEach(el => {
    el.addEventListener('click', () => {
      const bill = bills.find(b => b.id === el.dataset.id);
      const f = bill?.attachments?.[Number(el.dataset.i)];
      if (!f) return;
      document.getElementById('imgModalTitle').textContent = f.name;
      const body = document.getElementById('imgModalBody');
      if (f.type === 'application/pdf') {
        body.innerHTML = `<p>📄 ไฟล์ PDF: ${f.name}</p><a href="${f.dataUrl}" download="${f.name}" class="btn-primary" style="display:inline-block;margin-top:10px;padding:8px 16px;text-decoration:none;border-radius:8px;background:var(--pink);color:white;font-weight:700">⬇️ ดาวน์โหลด</a>`;
      } else {
        body.innerHTML = `<img src="${f.dataUrl}" style="width:100%;border-radius:8px" />`;
      }
      document.getElementById('imgModal').classList.add('is-open');
    });
  });

  // Edit / Delete
  tbody.querySelectorAll('[data-action]').forEach(btn => {
    btn.addEventListener('click', () => {
      const { action, id } = btn.dataset;
      if (action === 'delete') {
        if (!confirm('ลบบิลนี้?')) return;
        bills = bills.filter(b => b.id !== id);
        saveBills();
        renderTable();
        renderSummary();
      } else if (action === 'edit') {
        const bill = bills.find(b => b.id === id);
        if (!bill) return;
        editId = id;
        document.getElementById('formTitle').textContent = 'แก้ไขบิล';
        document.getElementById('clientName').value = bill.clientName;
        document.getElementById('billNote').value = bill.note || '';
        document.getElementById('billDate').value = bill.billDate || '';
        document.querySelector(`input[name="payStatus"][value="${bill.payStatus}"]`).checked = true;
        document.getElementById('serviceList').innerHTML = '';
        bill.services.forEach(s => addServiceRow(s.name, s.price));
        attachedFiles = [...(bill.attachments || [])];
        renderPreview();
        updateTotal();
        window.scrollTo({ top: 0, behavior: 'smooth' });
      }
    });
  });
}

// ---- SUMMARY ----
function renderSummary() {
  document.getElementById('sumTotal').textContent = bills.length;
  document.getElementById('sumPaid').textContent = bills.filter(b => b.payStatus === 'paid').length;
  document.getElementById('sumUnpaid').textContent = bills.filter(b => b.payStatus === 'unpaid').length;
}

// ---- SEARCH / FILTER ----
document.getElementById('searchInput').addEventListener('input', renderTable);
document.getElementById('filterStatus').addEventListener('change', renderTable);

// ---- SUGGESTIONS ----
function updateClientSuggestions() {
  const dl = document.getElementById('clientSuggestions');
  const names = [...new Set(bills.map(b => b.clientName))];
  dl.innerHTML = names.map(n => `<option value="${n}">`).join('');
}

// ---- MODAL ----
document.getElementById('imgModalClose').addEventListener('click', () => document.getElementById('imgModal').classList.remove('is-open'));
document.getElementById('imgModal').addEventListener('click', e => { if (e.target === e.currentTarget) e.currentTarget.classList.remove('is-open'); });
</script>
</body>
</html>
