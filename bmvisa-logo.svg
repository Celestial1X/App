  <path d="M110 324C109 181 227 72 370 79c26 1 56 8 83 20-23-21-59-40-98-47C215 26 92 136 89 275c0 27 5 52 14 75 4-8 7-17 7-26z" fill="url(#arcBlue)" opacity="0.95"/>
