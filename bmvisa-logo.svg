<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" role="img" aria-label="Bm Visa Center logo">
  <defs>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="0.8" />
    </filter>
    <linearGradient id="arcBlue" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#25c8e8"/>
      <stop offset="1" stop-color="#1ea5d5"/>
    </linearGradient>
    <linearGradient id="arcGold" x1="1" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffbf1f"/>
      <stop offset="1" stop-color="#f7a300"/>
