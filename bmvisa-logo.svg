    <text x="0" y="0" text-anchor="middle" font-size="94" font-family="'Brush Script MT', 'Segoe Script', cursive" fill="#0350b8" stroke="#023a86" stroke-width="3">Bm</text>
    <text x="0" y="44" text-anchor="middle" font-size="48" font-family="Sarabun, Arial, sans-serif" font-weight="700" fill="#ffb21e" stroke="#a86a00" stroke-width="1.8">Visa Center</text>
