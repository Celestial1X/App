    <rect x="0" y="56" rx="20" ry="20" width="164" height="88" fill="#22c6e7"/>
    <path d="M158 56h130c30 0 55 22 61 51l7 34c2 10-6 19-16 19H163z" fill="#f6ad06"/>
    <rect x="3" y="62" width="46" height="22" rx="11" fill="#f6ad06"/>
    <rect x="5" y="93" width="48" height="22" rx="11" fill="#f6ad06"/>
    <rect x="8" y="124" width="48" height="22" rx="11" fill="#f6ad06"/>
    <rect x="105" y="114" width="8" height="46" rx="4" fill="#7ca4b3"/>
    <rect x="130" y="114" width="8" height="46" rx="4" fill="#7ca4b3"/>
    <rect x="155" y="114" width="8" height="46" rx="4" fill="#7ca4b3"/>
  </g>

  <!-- stars -->
  <g fill="none" stroke="#06b6d4" stroke-width="4" stroke-linecap="round">
