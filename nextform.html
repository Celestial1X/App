<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>MOU ลาว - ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260211" />
  </head>
  <body data-page="moulaos">
    <header class="hero">
      <div class="hero__content">
        <div class="hero__top"></div>
        <h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1>
      </div>
    </header>

    <main class="container">
      <nav class="page-tabs">
        <a class="tab-btn" href="index.html">ค้นหาข้อมูล</a>
        <a class="tab-btn" href="records.html">ข้อมูลบันทึก</a>
        <a class="tab-btn" href="form.html">รับเอกสาร</a>
        <a class="tab-btn" href="report90.html">รายงานตัว 90 วัน</a>
        <a class="tab-btn" href="visarun.html">Visa run</a>
        <a class="tab-btn is-active" href="nextform.html">MOU ลาว</a>
      </nav>

      <section class="panel">
        <h2>MOU ลาว</h2>
        <form id="mouLaosForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="mouWorkerName">ชื่อต่างด้าว</label><input id="mouWorkerName" type="text" list="workerNameSuggestions" /></div>
            <div class="form-row"><label for="mouGender">เพศ</label><select id="mouGender"><option value="">เลือก</option><option value="female">female</option><option value="male">male</option><option value="other">other</option></select></div>
            <div class="form-row"><label for="mouEmployer">ชื่อนายจ้าง</label><input id="mouEmployer" type="text" list="employerNameSuggestions" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="mouStartDate">วันเริ่ม MOU</label><input id="mouStartDate" type="date" /></div>
            <div class="form-row"><label for="mouEndDate">ครบกำหนด 2 ปี</label><input id="mouEndDate" type="date" /></div>
            <div class="form-row"><label for="mouRecordedBy">ผู้บันทึกข้อมูล</label><input id="mouRecordedBy" type="text" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="mouDocReceiveDate">วันรับเอกสาร</label><input id="mouDocReceiveDate" type="date" /></div>
            <div class="form-row"><label for="mouDocReturnDate">วันคืนเอกสาร</label><input id="mouDocReturnDate" type="date" /></div>
            <div class="form-row"><label for="mouDocSentDate">วันที่ส่งเอกสาร</label><input id="mouDocSentDate" type="date" /></div>
          </div>
          <div class="grid-3">
            <label class="checkbox-item"><input id="mouSentImm" type="checkbox" /><span>ส่งเล่มไป ตม.</span></label>
            <label class="checkbox-item"><input id="mouReturnBook" type="checkbox" /><span>ส่งเล่มคืน</span></label>
            <label class="checkbox-item"><input id="mouOverdue" type="checkbox" /><span>เกินกำหนด</span></label>
          </div>
          <div class="form-actions"><span class="status-text" id="mouStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <h3>ข้อมูลบันทึก MOU ลาว</h3>
        <div id="mouAlert" class="warning-banner is-hidden"></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>ผู้บันทึก</th><th>รวมเล่มที่บันทึก</th><th>เล่มที่บันทึกล่าสุด</th><th>ครบกำหนด 2 ปี</th><th>สถานะเตือน</th><th>การจัดการ</th></tr></thead>
            <tbody id="mouList"></tbody>
          </table>
        </div>
      </section>
      <datalist id="workerNameSuggestions"></datalist>
      <datalist id="employerNameSuggestions"></datalist>
    </main>

    <div class="modal" id="followupModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="followupModalTitle">ตรวจสอบข้อมูล</h3>
          <button type="button" class="modal-close" id="followupModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="followupModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="followupModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="followup.js?v=20260211"></script>
  </body>
</html>
