<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>รับเอกสาร - ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260211" />
  </head>
  <body data-page="receivedocs">
    <header class="hero">
      <div class="hero__content">
        <div class="hero__top"></div>
        <h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1>
      </div>
    </header>

    <main class="container">
      <nav class="page-tabs">
        <a class="tab-btn is-active" href="receivedocs.html">รับเอกสาร</a>
        <a class="tab-btn" href="index.html">ค้นหาข้อมูล</a>
        <a class="tab-btn" href="records.html">ข้อมูลบันทึก</a>
        <a class="tab-btn" href="form.html">กรอกแบบฟอร์ม</a>
        <a class="tab-btn" href="report90.html">รายงานตัว 90 วัน</a>
        <a class="tab-btn" href="visarun.html">Visa run</a>
        <a class="tab-btn" href="nextform.html">MOU ลาว</a>
        <a class="tab-btn" href="returndocs.html">ส่งคืนเอกสาร</a>
      </nav>

      <section class="panel">
        <h2>รับเอกสาร</h2>
        <form id="receiveDocsForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="receiveWorkerName">ชื่อต่างด้าว</label><input id="receiveWorkerName" type="text" list="workerNameSuggestions" /></div>
            <div class="form-row"><label for="receiveEmployerName">ชื่อนายจ้าง</label><input id="receiveEmployerName" type="text" list="employerNameSuggestions" /></div>
            <div class="form-row"><label for="receiveTaskType">รายการที่ทำ</label><input id="receiveTaskType" type="text" placeholder="เช่น เปลี่ยนนายจ้าง แจ้งเข้า แจ้งออก" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="receiveDate">วันที่รับเอกสาร</label><input id="receiveDate" type="date" /></div>
            <div class="form-row"><label for="receiveBy">ผู้รับเอกสาร</label><input id="receiveBy" type="text" /></div>
          </div>
          <div class="form-actions"><span class="status-text" id="receiveDocsStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <div class="records-toolbar"><h3>ข้อมูลบันทึก รับเอกสาร</h3><div class="table-actions"><button type="button" class="secondary" id="exportReceiveDocs">ส่งออก Excel (CSV)</button></div></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>รายการที่ทำ</th><th>วันที่รับเอกสาร</th><th>ผู้รับเอกสาร</th><th>การจัดการ</th></tr></thead>
            <tbody id="receiveDocsList"></tbody>
          </table>
        </div>
      </section>
      <datalist id="workerNameSuggestions"></datalist>
      <datalist id="employerNameSuggestions"></datalist>
    </main>

    <div class="modal" id="followupModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="followupModalTitle">ตรวจสอบข้อมูล</h3>
          <button type="button" class="modal-close" id="followupModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="followupModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="followupModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="followup.js?v=20260211"></script>
  </body>
</html>
