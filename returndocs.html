<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <title>ส่งคืนเอกสาร - ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260528" />
  </head>
  <body data-page="returndocs">
    <header class="hero">
      <div class="hero__content">
        <div class="hero__top"></div>
        <h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1>
      </div>
    </header>

    <main class="container">
            <nav class="page-tabs">
        <a class="tab-btn" href="tasks.html">📋 งานวันนี้</a>
        <a class="tab-btn" href="receivedocs.html">📥 รับเอกสาร</a>
        <a class="tab-btn" href="index.html">🔍 ค้นหา</a>
        <a class="tab-btn" href="records.html">📂 บันทึก</a>
        <a class="tab-btn" href="form.html">✏️ กรอกฟอร์ม</a>
        <a class="tab-btn" href="report90.html">📅 90 วัน</a>
        <a class="tab-btn" href="visarun.html">✈️ Visa Run</a>
        <a class="tab-btn" href="nextform.html">📄 MOU ลาว</a>
        <a class="tab-btn is-active" href="returndocs.html">📤 ส่งคืน</a>
        <a class="tab-btn" href="billing-doc-8.html">💳 วางบิล</a>
      </nav>

      <section class="panel">
        <h2>ส่งคืนเอกสาร</h2>
        <form id="returnDocsForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="returnWorkerName">ชื่อต่างด้าว</label><input id="returnWorkerName" type="text" list="workerNameSuggestions" /></div>
            <div class="form-row"><label for="returnEmployerName">ชื่อนายจ้าง</label><input id="returnEmployerName" type="text" list="employerNameSuggestions" /></div>
            <div class="form-row"><label for="returnTaskType">รายการที่ทำ</label><input id="returnTaskType" type="text" placeholder="เช่น เปลี่ยนนายจ้าง แจ้งเข้า แจ้งออก" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="returnDate">วันที่ส่งคืนเอกสาร</label><input id="returnDate" type="date" /></div>
            <div class="form-row"><label for="returnBy">ผู้ส่งคืนเอกสาร</label><input id="returnBy" type="text" /></div>
          </div>
          <div class="form-actions"><span class="status-text" id="returnDocsStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <div class="records-toolbar"><h3>ข้อมูลบันทึก ส่งคืนเอกสาร</h3><div class="table-actions"><button type="button" class="secondary" id="exportReturnDocs">ส่งออก Excel</button></div></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th><input type="checkbox" data-export-check-all aria-label="เลือกทั้งหมด" /></th><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>รายการที่ทำ</th><th>วันที่ส่งคืนเอกสาร</th><th>ผู้ส่งคืนเอกสาร</th><th>การจัดการ</th></tr></thead>
            <tbody id="returnDocsList"></tbody>
          </table>
        </div>
      </section>
      <datalist id="workerNameSuggestions"></datalist>
      <datalist id="employerNameSuggestions"></datalist>
    </main>

    <div class="modal" id="followupModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="followupModalTitle">ตรวจสอบข้อมูล</h3>
          <button type="button" class="modal-close" id="followupModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="followupModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="followupModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="followup.js?v=20260528"></script>
      <script src="datepicker.js?v=20260528"></script>
  </body>
</html>
