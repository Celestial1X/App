      <div class="app-main">
        <header class="hero">
          <div class="hero__content">
            <div class="hero__top"><h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1></div>
          </div>
        </header>

        <main class="container">
          <section class="panel">
        <h2>ส่งคืนเอกสาร</h2>
        <form id="returnDocsForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="returnWorkerName">ชื่อต่างด้าว</label><input id="returnWorkerName" type="text" list="workerNameSuggestions" /></div>
            <div class="form-row"><label for="returnEmployerName">ชื่อนายจ้าง</label><input id="returnEmployerName" type="text" list="employerNameSuggestions" /></div>
            <div class="form-row"><label for="returnTaskType">รายการที่ทำ</label><input id="returnTaskType" type="text" placeholder="เช่น เปลี่ยนนายจ้าง แจ้งเข้า แจ้งออก" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="returnDate">วันที่ส่งคืนเอกสาร</label><input id="returnDate" type="date" /></div>
            <div class="form-row"><label for="returnBy">ผู้ส่งคืนเอกสาร</label><input id="returnBy" type="text" /></div>
          </div>
          <div class="form-actions form-actions--sticky"><span class="status-text" id="returnDocsStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <div class="records-toolbar"><h3>ข้อมูลบันทึก ส่งคืนเอกสาร</h3><div class="table-actions"><button type="button" class="secondary" id="exportReturnDocs">ส่งออก Excel</button></div></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th><input type="checkbox" data-export-check-all aria-label="เลือกทั้งหมด" /></th><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>รายการที่ทำ</th><th>วันที่ส่งคืนเอกสาร</th><th>ผู้ส่งคืนเอกสาร</th><th>การจัดการ</th></tr></thead>
            <tbody id="returnDocsList"></tbody>
          </table>
        </div>
      </section>
      <datalist id="workerNameSuggestions"></datalist>
      <datalist id="employerNameSuggestions"></datalist>
    </main>
