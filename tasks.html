    </header>

    <main class="container">
            <nav class="page-tabs">
        <a class="tab-btn is-active" href="tasks.html">📋 งานวันนี้</a>

      <section class="panel">
        <h2>งานที่ต้องทำ</h2>
        <div id="taskEntryNotice" class="task-entry-notice is-hidden" aria-live="polite"></div>
        <section class="today-task-spotlight" id="todayTaskSpotlight" aria-live="polite">
          <div class="today-task-spotlight__head">
            <p class="today-task-spotlight__tag">งานที่ต้องทำประจำวัน</p>
            <h3>รายการงานวันนี้และวันถัดไป</h3>
            <p id="todayTaskSubtitle" class="status-text">กำลังตรวจสอบรายการ...</p>
          </div>
          <div class="today-documents" id="todayDocumentTasks" aria-live="polite"></div>
          <form id="todayTaskQuickAdd" class="today-task-quickadd">
            <input id="todayTaskQuickTitle" type="text" placeholder="เพิ่มชื่องาน เช่น ต่อใบอนุญาตแรงงาน" />
            <input id="todayTaskQuickDate" type="date" />
            <input id="todayTaskQuickNote" type="text" placeholder="หมายเหตุ (ถ้ามี)" />
            <button id="todayTaskQuickAddButton" type="submit" class="primary">เพิ่มรายการ</button>
          </form>
          <p id="todayTaskQuickStatus" class="status-text"></p>
          <div id="todayTaskBuckets" class="today-task-buckets"></div>
        </section>
      </section>
    </main>

    <div class="modal" id="recordModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="recordModalTitle">งานที่ต้องทำ</h3>
          <button type="button" class="modal-close" id="recordModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="recordModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="recordModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="app.js?v=20260528"></script>
    <script src="datepicker.js?v=20260528"></script>
