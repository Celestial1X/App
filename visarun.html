<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Visa run - ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Sarabun:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260211" />
  </head>
  <body data-page="visarun">
    <header class="hero">
      <div class="hero__content">
        <div class="hero__top"></div>
        <h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1>
      </div>
    </header>

    <main class="container">
      <nav class="page-tabs">
        <a class="tab-btn" href="index.html">ค้นหาข้อมูล</a>
        <a class="tab-btn" href="records.html">ข้อมูลบันทึก</a>
        <a class="tab-btn" href="form.html">กรอกแบบฟอร์ม</a>
        <a class="tab-btn" href="report90.html">รายงานตัว 90 วัน</a>
        <a class="tab-btn is-active" href="visarun.html">Visa run</a>
      </nav>

      <section class="panel">
        <h2>Visa run</h2>
        <form id="visaRunForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="visaWorkerName">ชื่อต่างด้าว</label><input id="visaWorkerName" required type="text" /></div>
            <div class="form-row"><label for="visaNationality">สัญชาติ</label><select id="visaNationality" required><option value="">เลือก</option><option value="female">female</option><option value="male">male</option><option value="other">other</option></select></div>
            <div class="form-row"><label for="visaEmployer">ชื่อนายจ้าง</label><input id="visaEmployer" required type="text" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="visaStartDate">วันเริ่ม Visa</label><input id="visaStartDate" required type="date" /></div>
            <div class="form-row"><label for="visaEndDate">วันหมด Visa</label><input id="visaEndDate" required type="date" /></div>
            <div class="form-row"><label for="visaRecordedBy">ผู้บันทึกข้อมูล</label><input id="visaRecordedBy" required type="text" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label>ส่งเล่มไป ตม. กี่เล่ม</label>
              <div class="count-control" data-counter="visaSentBookCount">
                <button type="button" class="count-btn" data-action="decrease">-</button>
                <input id="visaSentBookCount" type="hidden" value="0" />
                <span id="visaSentBookCountDisplay" class="count-value">0</span>
                <button type="button" class="count-btn" data-action="increase">+</button>
              </div>
            </div>
            <div class="form-row"><label>ส่งเล่มคืนกี่เล่ม</label>
              <div class="count-control" data-counter="visaReturnBookCount">
                <button type="button" class="count-btn" data-action="decrease">-</button>
                <input id="visaReturnBookCount" type="hidden" value="0" />
                <span id="visaReturnBookCountDisplay" class="count-value">0</span>
                <button type="button" class="count-btn" data-action="increase">+</button>
              </div>
            </div>
            <div class="form-row checklist-col">
              <label class="checkbox-item"><input id="visaOverdue" type="checkbox" /><span>Visa เกิน</span></label>
              <label class="checkbox-item"><input id="visaSentImm" type="checkbox" /><span>ส่งเล่มไป ตม.</span></label>
              <label class="checkbox-item"><input id="visaReturnBook" type="checkbox" /><span>ส่งเล่มคืน</span></label>
              <label class="checkbox-item"><input id="visaP60" type="checkbox" /><span>ผ.60</span></label>
              <label class="checkbox-item"><input id="visaP30" type="checkbox" /><span>ผ.30</span></label>
            </div>
          </div>
          <div class="form-actions"><span class="status-text" id="visaStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <h3>ข้อมูลบันทึก Visa run</h3>
        <div id="visaAlert" class="warning-banner is-hidden"></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>ผู้บันทึก</th><th>ส่งไป ตม.</th><th>ส่งคืน</th><th>วันหมด Visa</th><th>สถานะเตือน</th><th>การจัดการ</th></tr></thead>
            <tbody id="visaList"></tbody>
          </table>
        </div>
      </section>
    </main>

    <div class="modal" id="followupModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="followupModalTitle">ตรวจสอบข้อมูล</h3>
          <button type="button" class="modal-close" id="followupModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="followupModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="followupModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="followup.js?v=20260211"></script>
  </body>
</html>
