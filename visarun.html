<!DOCTYPE html>
<html lang="th">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#ec4899" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="manifest" href="manifest.json" />
    <title>Visa run - ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</title>
    <link href="https://fonts.googleapis.com/css2?family=Prompt:wght@300;400;500;600;700&family=Sarabun:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="styles.css?v=20260528" />
  </head>
  <body data-page="visarun">
    <header class="hero">
      <div class="hero__content">
        <div class="hero__top"></div>
        <h1>ระบบตรวจสอบข้อมูลแรงงานต่างด้าว</h1>
      </div>
    </header>

    <main class="container">
            <nav class="page-tabs">
        <a class="tab-btn" href="tasks.html">📋 งานวันนี้</a>
        <a class="tab-btn" href="receivedocs.html">📥 รับเอกสาร</a>
        <a class="tab-btn" href="index.html">🔍 ค้นหา</a>
        <a class="tab-btn" href="records.html">📂 บันทึก</a>
        <a class="tab-btn" href="form.html">✏️ กรอกฟอร์ม</a>
        <a class="tab-btn" href="report90.html">📅 90 วัน</a>
        <a class="tab-btn is-active" href="visarun.html">✈️ Visa Run</a>
        <a class="tab-btn" href="nextform.html">📄 MOU ลาว</a>
        <a class="tab-btn" href="returndocs.html">📤 ส่งคืน</a>
        <a class="tab-btn" href="billing-doc-8.html">💳 วางบิล</a>
      </nav>

      <section class="panel">
        <h2>Visa run</h2>
        <form id="visaRunForm" class="form-grid">
          <div class="grid-3">
            <div class="form-row"><label for="visaWorkerName">ชื่อต่างด้าว</label><input id="visaWorkerName" type="text" list="workerNameSuggestions" /></div>
            <div class="form-row"><label for="visaGender">เพศ</label><select id="visaGender"><option value="">เลือก</option><option value="female">female</option><option value="male">male</option><option value="other">other</option></select></div>
            <div class="form-row"><label for="visaEmployer">ชื่อนายจ้าง</label><input id="visaEmployer" type="text" list="employerNameSuggestions" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="visaStartDate">วันเริ่ม Visa</label><input id="visaStartDate" type="date" /></div>
            <div class="form-row"><label for="visaEndDate">วันหมด Visa</label><input id="visaEndDate" type="date" /></div>
            <div class="form-row"><label for="visaRecordedBy">ผู้บันทึกข้อมูล</label><input id="visaRecordedBy" type="text" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label for="visaDocReceiveDate">วันรับเอกสาร</label><input id="visaDocReceiveDate" type="date" /></div>
            <div class="form-row"><label for="visaDocReturnDate">วันคืนเอกสาร</label><input id="visaDocReturnDate" type="date" /></div>
          </div>
          <div class="grid-3">
            <div class="form-row"><label class="helper-text">จำนวนเล่มจะนับอัตโนมัติเมื่อกดบันทึก</label></div>
            <div class="form-row"><label class="helper-text">ระบบจะแสดงว่าเล่มที่บันทึกคือเล่มอะไร</label></div>
            <div class="form-row checklist-col">
              <label class="checkbox-item"><input id="visaOverdue" type="checkbox" /><span>Visa เกิน</span></label>
              <label class="checkbox-item"><input id="visaSentImm" type="checkbox" /><span>ส่งเล่มไป ตม.</span></label>
              <label class="checkbox-item"><input id="visaReturnBook" type="checkbox" /><span>ส่งเล่มคืน</span></label>
              <label class="checkbox-item"><input id="visaP60" type="checkbox" /><span>ผ.60</span></label>
              <label class="checkbox-item"><input id="visaP30" type="checkbox" /><span>ผ.30</span></label>
            </div>
          </div>
          <div class="form-actions"><span class="status-text" id="visaStatus"></span><button class="primary" type="submit">บันทึกข้อมูล</button></div>
        </form>
      </section>

      <section class="panel">
        <div class="records-toolbar"><h3>ข้อมูลบันทึก Visa run</h3><div class="table-actions"><input id="visaRunSearch" type="search" placeholder="ค้นหาชื่อต่างด้าว" /><button type="button" class="secondary" id="exportVisaRun">ส่งออก Excel</button></div></div>
        <div id="visaAlert" class="warning-banner is-hidden"></div>
        <div class="records-table-wrapper">
          <table class="records-table">
            <thead><tr><th><input type="checkbox" data-export-check-all aria-label="เลือกทั้งหมด" /></th><th>ชื่อต่างด้าว</th><th>นายจ้าง</th><th>ผู้บันทึก</th><th>เล่มที่บันทึกล่าสุด</th><th>วันหมด Visa</th><th>สถานะเตือน</th><th>การจัดการ</th></tr></thead>
            <tbody id="visaList"></tbody>
          </table>
        </div>
      </section>
      <datalist id="workerNameSuggestions"></datalist>
  <datalist id="employerNameSuggestions"></datalist>
    </main>

    <div class="modal" id="followupModal" aria-hidden="true">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="followupModalTitle">ตรวจสอบข้อมูล</h3>
          <button type="button" class="modal-close" id="followupModalClose" aria-label="ปิด">✕</button>
        </div>
        <div id="followupModalBody" class="modal-body"></div>
        <div class="modal-actions">
          <button type="button" class="secondary" id="followupModalCloseButton">ปิดหน้าต่าง</button>
        </div>
      </div>
    </div>

    <script src="followup.js?v=20260528"></script>
      <script src="datepicker.js?v=20260528"></script>
  </body>
</html>
